<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JARVIS 2.0</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#020711;color:#e9fbff;font-family:Arial,"Noto Sans KR",sans-serif}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(rgba(50,210,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(50,210,255,.035) 1px,transparent 1px);background-size:32px 32px}.app{max-width:1100px;margin:auto;padding:22px 16px}header{display:flex;justify-content:space-between;align-items:center}.logo{font-weight:800;letter-spacing:4px}.pill{border:1px solid #31566b;border-radius:999px;padding:8px 12px;font-size:12px;letter-spacing:2px}.active{border-color:#35e8ff;box-shadow:0 0 20px #1a8da5}.stage{min-height:420px;display:grid;place-items:center}.core{width:235px;height:235px;border:2px solid #38ddff;border-radius:50%;position:relative;display:grid;place-items:center;box-shadow:0 0 25px #0789ac,inset 0 0 45px #062e43}.core:before,.core:after{content:"";position:absolute;border:1px solid #35cfe7;border-radius:50%}.core:before{inset:20px}.core:after{inset:46px}.dot{width:62px;height:62px;background:#d8fcff;border-radius:50%;box-shadow:0 0 45px #3deaff}.listening{animation:pulse 1s infinite}.processing{animation:spin 1.3s infinite}.sleep{opacity:.5;filter:grayscale(.7)}@keyframes pulse{50%{transform:scale(1.05);box-shadow:0 0 70px #1ed9ff,inset 0 0 60px #073e59}}@keyframes spin{50%{transform:rotate(180deg) scale(1.03)}}.panel{background:rgba(4,16,29,.84);border:1px solid #21465d;border-radius:16px;padding:16px;backdrop-filter:blur(10px)}.mainmsg{font-size:21px;min-height:30px}.muted{color:#7899ab;font-size:13px;margin-top:7px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.panel h3{font-size:13px;letter-spacing:2px;color:#6deaff;margin:0 0 12px}.history{height:170px;overflow:auto;font-size:13px;line-height:1.55}.row{padding:8px 0;border-bottom:1px solid #183042}.you{color:#c8f6ff}.jarvis{color:#72e8ff}button{background:#0a2234;border:1px solid #3b7188;color:#dffaff;border-radius:9px;padding:10px 13px;margin:3px;cursor:pointer}button:hover{background:#10364e}button:disabled{opacity:.5}#result{line-height:1.7}.bar{height:4px;background:#102d3c;border-radius:10px;overflow:hidden;margin-top:10px}.bar i{display:block;width:30%;height:100%;background:#43e6ff;animation:move 1s infinite}@keyframes move{50%{transform:translateX(230%)}}@media(max-width:700px){.grid{grid-template-columns:1fr}.stage{min-height:340px}.core{width:190px;height:190px}}
</style></head><body><div class="app"><header><div class="logo">JARVIS // 2.0</div><div id="status" class="pill">SLEEP</div></header><section class="stage"><div id="core" class="core sleep"><div class="dot"></div></div></section><section class="panel"><div id="mainmsg" class="mainmsg">휴면 상태입니다. 박수 2번으로 깨워주세요.</div><div id="sub" class="muted">마이크를 시작하면 박수 감지를 준비합니다.</div><div id="bar" style="display:none" class="bar"><i></i></div></section><div class="grid"><section class="panel"><h3>CONTROL</h3><button id="mic">🎙️ 마이크 시작</button><button id="sleep">💤 휴면</button><button id="clear">기록 지우기</button><p class="muted">깨우기: 박수 2번 · 휴면: 쉬어/휴면/잘 자</p></section><section class="panel"><h3>RESULT</h3><div id="result">대기 중</div></section><section class="panel" style="grid-column:1/-1"><h3>COMMAND LOG</h3><div id="history" class="history"></div></section></div></div>
<script>
const $=id=>document.getElementById(id), core=$("core"),status=$("status"),mainmsg=$("mainmsg"),sub=$("sub"),result=$("result"),history=$("history"),bar=$("bar");
let stream,ctx,analyser,raf,claps=[],awake=false,recognition,lastSpeech="",speaking=false;
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function state(s,m,sm=""){core.className="core "+s;status.className="pill "+(s==="sleep"?"":"active");status.textContent=s.toUpperCase();mainmsg.textContent=m;sub.textContent=sm;bar.style.display=s==="processing"?"block":"none"}
function say(t){if(!speechSynthesis)return;speaking=true;lastSpeech=t;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="ko-KR";u.rate=1;u.onend=()=>speaking=false;speechSynthesis.speak(u)}
function log(who,t){const d=document.createElement("div");d.className="row "+(who==="YOU"?"you":"jarvis");d.textContent=who+": "+t;history.appendChild(d);history.scrollTop=history.scrollHeight}
async function start(){try{stream=await navigator.mediaDevices.getUserMedia({audio:true});ctx=new (AudioContext||webkitAudioContext)();analyser=ctx.createAnalyser();analyser.fftSize=1024;ctx.createMediaStreamSource(stream).connect(analyser);detect();if(SR) setup();$("mic").disabled=true;$("mic").textContent="🎙️ 마이크 실행 중";state("sleep","휴면 상태입니다.","👏 박수 2번을 기다리는 중")}catch(e){state("sleep","마이크 권한이 필요합니다.","HTTPS에서 마이크 권한을 허용해주세요.")}}
function detect(){const a=new Uint8Array(analyser.fftSize);let last=0;const loop=now=>{analyser.getByteTimeDomainData(a);let sum=0;for(const v of a){const x=(v-128)/128;sum+=x*x}const rms=Math.sqrt(sum/a.length);if(rms>.18&&now-last>180){last=now;claps.push(now);claps=claps.filter(t=>now-t<1200);if(claps.length>=2){claps=[];wake()}}raf=requestAnimationFrame(loop)};raf=requestAnimationFrame(loop)}
function wake(){if(awake)return;awake=true;state("listening","안녕하세요. 오늘은 무엇을 도와드릴까요?","음성 명령을 기다리는 중");log("JARVIS","안녕하세요. 오늘은 무엇을 도와드릴까요?");say("안녕하세요. 오늘은 무엇을 도와드릴까요?");if(recognition)try{recognition.start()}catch(e){}}
function goSleep(){awake=false;if(recognition)try{recognition.stop()}catch(e){}speechSynthesis?.cancel();state("sleep","휴면 상태에 돌입합니다.","👏 박수 2번을 기다리는 중");log("JARVIS","휴면 상태에 돌입합니다.");say("휴면 상태에 돌입합니다.")}
function setup(){recognition=new SR();recognition.lang="ko-KR";recognition.continuous=true;recognition.interimResults=false;recognition.onresult=async e=>{if(!awake||speaking)return;const t=e.results[e.results.length-1][0].transcript.trim();if(!t||t===lastSpeech)return;log("YOU",t);state("processing",`“${t}”`,"명령을 처리하는 중");await command(t)};recognition.onend=()=>{if(awake)setTimeout(()=>{try{recognition.start()}catch(e){}},250)}}
function city(t){return ["서울","부산","인천","대구","대전","광주","울산","수원","용인","성남","제주","도쿄","런던","뉴욕"].find(x=>t.includes(x))||"서울"}
function weatherText(c){if(c===0)return"맑음";if([1,2,3].includes(c))return"구름 또는 흐림";if([45,48].includes(c))return"안개";if([51,53,55,56,57].includes(c))return"이슬비";if([61,63,65,66,67].includes(c))return"비";if([71,73,75,77].includes(c))return"눈";if([80,81,82].includes(c))return"소나기";if([95,96,99].includes(c))return"뇌우";return"날씨 확인 필요"}
async function command(text){const t=text.replace(/\s/g,"").toLowerCase();if(["쉬어","휴면","잘자","잠자","쉬자","휴식"].some(x=>t.includes(x))){goSleep();return}if(t.includes("시간")){const d=await (await fetch("/api/time")).json();result.textContent=d.korean;state("listening",d.korean,"명령을 기다리는 중");log("JARVIS",d.korean);say("현재 시간은 "+d.korean+"입니다.");return}if(t.includes("날씨")||t.includes("기온")||t.includes("온도")){try{const d=await (await fetch("/api/weather?city="+encodeURIComponent(city(t)))).json();if(!d.current)throw 0;const a=`${d.city} 현재 ${Math.round(d.current.temperature_2m)}도, ${weatherText(d.current.weather_code)}입니다. 습도 ${Math.round(d.current.relative_humidity_2m)}퍼센트입니다.`;result.textContent=a;state("listening",a,"명령을 기다리는 중");log("JARVIS",a);say(a)}catch(e){fail("날씨 정보를 가져오지 못했습니다.")}return}if(t.includes("검색")||t.includes("찾아")){let q=text.replace(/검색해줘|검색|찾아줘|찾아/g,"").trim();if(!q)return fail("무엇을 검색할까요?");const d=await (await fetch("/api/search?q="+encodeURIComponent(q))).json();result.innerHTML=`<div>${esc(d.preview)}</div><br><a target="_blank" rel="noopener" href="${d.url}">🔎 전체 검색 결과 열기</a>`;const a=`${q} 검색 결과를 준비했습니다.`;state("listening",a,"명령을 기다리는 중");log("JARVIS",a);say(a);return}const a="현재 시간, 날씨, 검색, 휴면 명령을 지원합니다.";result.textContent=a;state("listening",a,"명령을 기다리는 중");log("JARVIS",a);say(a)}
function fail(a){result.textContent=a;state("listening",a,"명령을 기다리는 중");log("JARVIS",a);say(a)}
function esc(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]))}
$("mic").onclick=start;$("sleep").onclick=goSleep;$("clear").onclick=()=>history.innerHTML="";
</script></body></html>
