<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E.B. Voice Core</title>

<script src="https://www.youtube.com/iframe_api"></script>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #020816;
  color: #dff7ff;
  font-family: Arial, "Noto Sans KR", sans-serif;
}

body {
  position: relative;
}

/* =========================
   BACKGROUND
========================= */

#background {
  position: fixed;
  inset: 0;
  overflow: hidden;
  background:
    radial-gradient(circle at center, rgba(0,180,255,.12), transparent 35%),
    linear-gradient(rgba(0,150,255,.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,150,255,.035) 1px, transparent 1px),
    #020816;
  background-size: auto, 45px 45px, 45px 45px;
}

.scan {
  position: absolute;
  left: 0;
  width: 100%;
  height: 1px;
  background: rgba(0,220,255,.18);
  animation: scan 5s linear infinite;
}

@keyframes scan {
  from {
    top: -10%;
  }
  to {
    top: 110%;
  }
}

/* =========================
   TOP
========================= */

#topBar {
  position: fixed;
  top: 20px;
  left: 25px;
  right: 25px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  z-index: 20;
}

#logo {
  font-size: 26px;
  font-weight: 800;
  letter-spacing: 6px;
  color: #7cecff;
  text-shadow: 0 0 15px rgba(0,220,255,.8);
}

#status {
  font-size: 13px;
  letter-spacing: 3px;
  color: #70dfff;
}

#status.awake {
  color: #fff;
  text-shadow: 0 0 15px #00d9ff;
}

/* =========================
   SIDE HUD
========================= */

.hud {
  position: fixed;
  top: 90px;
  width: 220px;
  z-index: 5;
  font-size: 12px;
  letter-spacing: 1px;
}

#leftHud {
  left: 25px;
}

#rightHud {
  right: 25px;
}

.panel {
  border: 1px solid rgba(0,190,255,.28);
  background: rgba(0,20,45,.35);
  padding: 14px;
  margin-bottom: 12px;
  box-shadow:
    inset 0 0 25px rgba(0,150,255,.04),
    0 0 20px rgba(0,100,255,.04);
}

.panelTitle {
  color: #52dfff;
  margin-bottom: 8px;
  font-weight: bold;
  letter-spacing: 2px;
}

.panelValue {
  color: #dffaff;
  line-height: 1.7;
}

/* =========================
   CENTER CORE
========================= */

#coreArea {
  position: absolute;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
}

#core {
  position: relative;
  width: 330px;
  height: 330px;
}

.ring {
  position: absolute;
  left: 50%;
  top: 50%;
  border: 1px solid rgba(0,220,255,.55);
  border-radius: 50%;
  transform: translate(-50%, -50%);
}

.ring1 {
  width: 310px;
  height: 310px;
  animation: rotate1 14s linear infinite;
}

.ring2 {
  width: 245px;
  height: 245px;
  border-style: dashed;
  animation: rotate2 9s linear infinite;
}

.ring3 {
  width: 180px;
  height: 180px;
  animation: rotate1 6s linear infinite reverse;
}

@keyframes rotate1 {
  from {
    transform: translate(-50%, -50%) rotate(0deg);
  }
  to {
    transform: translate(-50%, -50%) rotate(360deg);
  }
}

@keyframes rotate2 {
  from {
    transform: translate(-50%, -50%) rotate(360deg);
  }
  to {
    transform: translate(-50%, -50%) rotate(0deg);
  }
}

#aura1,
#aura2,
#aura3 {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  border-radius: 50%;
}

#aura1 {
  width: 145px;
  height: 145px;
  background: rgba(0,190,255,.05);
  box-shadow: 0 0 80px rgba(0,200,255,.25);
}

#aura2 {
  width: 115px;
  height: 115px;
  background: rgba(0,180,255,.08);
  box-shadow: 0 0 50px rgba(0,200,255,.4);
}

#aura3 {
  width: 80px;
  height: 80px;
  background: rgba(100,230,255,.15);
  box-shadow: 0 0 35px rgba(0,220,255,.8);
}

#coreText {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  z-index: 4;
  text-align: center;
}

#coreName {
  font-size: 30px;
  font-weight: bold;
  letter-spacing: 8px;
}

#coreState {
  margin-top: 8px;
  font-size: 10px;
  letter-spacing: 3px;
  color: #62ddff;
}

/* =========================
   SOUND DETECTED
========================= */

#soundDetected {
  position: fixed;
  left: 50%;
  bottom: 80px;
  transform: translateX(-50%);
  padding: 10px 20px;
  border: 1px solid rgba(0,220,255,.55);
  background: rgba(0,30,60,.7);
  color: #9ceeff;
  letter-spacing: 2px;
  opacity: 0;
  transition: opacity .15s ease;
  z-index: 50;
  pointer-events: none;
}

#soundDetected.show {
  opacity: 1;
}

/* =========================
   COMMAND DISPLAY
========================= */

#commandDisplay {
  position: fixed;
  left: 50%;
  bottom: 25px;
  transform: translateX(-50%);
  width: min(800px, 80vw);
  text-align: center;
  font-size: 14px;
  color: #8eeaff;
  min-height: 20px;
  z-index: 10;
}

/* =========================
   START BUTTON
========================= */

#start {
  position: fixed;
  left: 50%;
  top: 50%;
  width: 30px;
  height: 30px;
  transform: translate(-50%, -50%);
  opacity: 0.02;
  cursor: pointer;
  z-index: 100;
}

/* =========================
   YOUTUBE
========================= */

#youtubePanel {
  position: fixed;
  right: 25px;
  bottom: 25px;
  width: 420px;
  height: 470px;
  display: none;
  background: rgba(2,10,25,.96);
  border: 1px solid rgba(0,220,255,.45);
  box-shadow: 0 0 40px rgba(0,160,255,.15);
  z-index: 80;
}

#youtubePanel.show {
  display: block;
}

#youtubeHeader {
  height: 45px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 12px;
  color: #6fe6ff;
  border-bottom: 1px solid rgba(0,220,255,.2);
}

#youtubeClose {
  background: none;
  border: none;
  color: #8deaff;
  font-size: 25px;
  cursor: pointer;
}

#youtubePlayer {
  width: 100%;
  height: 235px;
}

#youtubeResults {
  height: 190px;
  overflow-y: auto;
}

.youtubeResult {
  display: flex;
  gap: 9px;
  padding: 8px;
  cursor: pointer;
  border-bottom: 1px solid rgba(0,180,255,.1);
}

.youtubeResult:hover {
  background: rgba(0,180,255,.1);
}

.youtubeResult img {
  width: 100px;
  height: 58px;
  object-fit: cover;
}

.youtubeResultTitle {
  font-size: 12px;
  line-height: 1.35;
}

.youtubeResultChannel {
  color: #6aadc0;
  font-size: 10px;
  margin-top: 5px;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 800px) {
  .hud {
    display: none;
  }

  #youtubePanel {
    left: 5%;
    right: 5%;
    width: 90%;
  }

  #core {
    transform: scale(.8);
  }
}
</style>
</head>

<body>

<div id="background">
  <div class="scan"></div>
</div>

<div id="topBar">
  <div id="logo">E.B.</div>
  <div id="status">VOICE CORE / SLEEP</div>
</div>

<div id="leftHud" class="hud">

  <div class="panel">
    <div class="panelTitle">SYSTEM</div>
    <div id="systemValue" class="panelValue">
      STANDBY
    </div>
  </div>

  <div class="panel">
    <div class="panelTitle">MIC INPUT</div>
    <div id="micValue" class="panelValue">
      OFF
    </div>
  </div>

  <div class="panel">
    <div class="panelTitle">MEMORY</div>
    <div id="memoryValue" class="panelValue">
      READY
    </div>
  </div>

</div>

<div id="rightHud" class="hud">

  <div class="panel">
    <div class="panelTitle">VOICE</div>
    <div id="voiceValue" class="panelValue">
      KO-KR
    </div>
  </div>

  <div class="panel">
    <div class="panelTitle">STATE</div>
    <div id="stateValue" class="panelValue">
      SLEEP
    </div>
  </div>

  <div class="panel">
    <div class="panelTitle">AUDIO GAIN</div>
    <div class="panelValue">
      x5
    </div>
  </div>

</div>

<div id="coreArea">
  <div id="core">

    <div class="ring ring1"></div>
    <div class="ring ring2"></div>
    <div class="ring ring3"></div>

    <div id="aura1"></div>
    <div id="aura2"></div>
    <div id="aura3"></div>

    <div id="coreText">
      <div id="coreName">E.B.</div>
      <div id="coreState">SLEEP MODE</div>
    </div>

  </div>
</div>

<div id="soundDetected">
  소리가 감지됐습니다
</div>

<div id="commandDisplay"></div>

<button id="start" onclick="startAssistant()"></button>

<div id="youtubePanel">

  <div id="youtubeHeader">
    <span>E.B. / YOUTUBE CORE</span>
    <button id="youtubeClose" onclick="closeYouTube()">×</button>
  </div>

  <div id="youtubePlayer"></div>

  <div id="youtubeResults"></div>

</div>

<script>
(() => {

"use strict";

/* =========================================================
   STATE
========================================================= */

let running = false;
let awake = false;
let speaking = false;
let processing = false;

let recognition = null;
let recognitionStarting = false;
let recognitionRestartTimer = null;

let microphoneStream = null;
let audioContext = null;
let microphoneSource = null;
let inputGain = null;
let analyser = null;

let clapCount = 0;
let clapResetTimer = null;
let lastClapTime = 0;

let currentAudio = null;

let youtubePlayer = null;
let youtubeReady = false;
let youtubeResults = [];
let youtubeCurrentIndex = -1;
let youtubeCurrentQuery = "";
let lastRecognizedText = "";
let lastRecognizedTime = 0;

/* =========================================================
   MEMORY
========================================================= */

const MEMORY_KEY = "EB_CONVERSATION_MEMORY";

let conversationMemory = {
  lastUserText: "",
  lastAssistantText: "",
  lastAction: "",
  lastWebsite: "",
  lastCity: "",
  lastSearch: "",
  lastTopic: "",
  history: []
};

function loadMemory() {

  try {

    const saved =
      localStorage.getItem(MEMORY_KEY);

    if (!saved) return;

    const data =
      JSON.parse(saved);

    conversationMemory = {
      ...conversationMemory,
      ...data
    };

  } catch (error) {

    console.warn(
      "메모리 불러오기 실패:",
      error
    );

  }

  updateMemoryUI();
}

function saveMemory() {

  try {

    localStorage.setItem(
      MEMORY_KEY,
      JSON.stringify(conversationMemory)
    );

  } catch (error) {

    console.warn(
      "메모리 저장 실패:",
      error
    );

  }

  updateMemoryUI();
}

function rememberUser(text) {

  conversationMemory.lastUserText =
    text;

  conversationMemory.history.push({
    role: "user",
    text,
    time: Date.now()
  });

  if (
    conversationMemory.history.length > 30
  ) {

    conversationMemory.history =
      conversationMemory.history.slice(-30);

  }

  saveMemory();
}

function rememberAssistant(text) {

  conversationMemory.lastAssistantText =
    text;

  conversationMemory.history.push({
    role: "assistant",
    text,
    time: Date.now()
  });

  if (
    conversationMemory.history.length > 30
  ) {

    conversationMemory.history =
      conversationMemory.history.slice(-30);

  }

  saveMemory();
}

function rememberAction(
  action,
  data = {}
) {

  conversationMemory.lastAction =
    action;

  if (data.website) {
    conversationMemory.lastWebsite =
      data.website;
  }

  if (data.city) {
    conversationMemory.lastCity =
      data.city;
  }

  if (data.search) {
    conversationMemory.lastSearch =
      data.search;
  }

  if (data.topic) {
    conversationMemory.lastTopic =
      data.topic;
  }

  saveMemory();
}

function updateMemoryUI() {

  const el =
    document.getElementById(
      "memoryValue"
    );

  if (!el) return;

  if (
    conversationMemory.lastUserText
  ) {

    el.textContent =
      "ACTIVE";

  } else {

    el.textContent =
      "READY";

  }
}


/* =========================================================
   UI
========================================================= */

function setCommand(text) {

  const el =
    document.getElementById(
      "commandDisplay"
    );

  if (el) {
    el.textContent = text || "";
  }

}

function updateStateUI() {

  const status =
    document.getElementById(
      "status"
    );

  const system =
    document.getElementById(
      "systemValue"
    );

  const mic =
    document.getElementById(
      "micValue"
    );

  const state =
    document.getElementById(
      "stateValue"
    );

  const coreState =
    document.getElementById(
      "coreState"
    );

  if (awake) {

    if (status) {
      status.textContent =
        "VOICE CORE / ACTIVE";
      status.classList.add(
        "awake"
      );
    }

    if (system) {
      system.textContent =
        "ACTIVE";
    }

    if (state) {
      state.textContent =
        "AWAKE";
    }

    if (coreState) {
      coreState.textContent =
        "LISTENING";
    }

  } else {

    if (status) {
      status.textContent =
        "VOICE CORE / SLEEP";
      status.classList.remove(
        "awake"
      );
    }

    if (system) {
      system.textContent =
        running
          ? "STANDBY"
          : "OFF";
    }

    if (state) {
      state.textContent =
        "SLEEP";
    }

    if (coreState) {
      coreState.textContent =
        "SLEEP MODE";
    }

  }

  if (mic) {
    mic.textContent =
      running
        ? "ACTIVE"
        : "OFF";
  }

}


/* =========================================================
   TTS
========================================================= */

async function speak(text) {

  if (!text) return;

  speaking = true;

  setCommand(
    "E.B.: " + text
  );

  try {

    /*
      서버 TTS
    */

    try {

      const response =
        await fetch(
          "/api/tts",
          {
            method: "POST",
            headers: {
              "Content-Type":
                "application/json"
            },
            body: JSON.stringify({
              text
            })
          }
        );

      if (response.ok) {

        const data =
          await response.json();

        if (data.audio) {

          if (currentAudio) {

            try {
              currentAudio.pause();
            } catch (_) {}

          }

          currentAudio =
            new Audio(data.audio);

          await new Promise(
            resolve => {

              let finished = false;

              const done = () => {

                if (finished) return;

                finished = true;

                resolve();

              };

              currentAudio.onended =
                done;

              currentAudio.onerror =
                done;

              currentAudio
                .play()
                .catch(done);

              setTimeout(
                done,
                15000
              );

            }
          );

          return;

        }

      }

    } catch (error) {

      console.warn(
        "서버 TTS 실패:",
        error
      );

    }

    /*
      브라우저 TTS fallback
    */

    if (
      "speechSynthesis"
      in window
    ) {

      window.speechSynthesis.cancel();

      await new Promise(
        resolve => {

          const utterance =
            new SpeechSynthesisUtterance(
              text
            );

          utterance.lang =
            "ko-KR";

          utterance.rate =
            1.0;

          utterance.pitch =
            0.9;

          utterance.volume =
            1.0;

          utterance.onend =
            resolve;

          utterance.onerror =
            resolve;

          window.speechSynthesis.speak(
            utterance
          );

          setTimeout(
            resolve,
            10000
          );

        }
      );

    }

  } finally {

    speaking = false;

  }

}

async function respond(text) {

  rememberAssistant(text);

  await speak(text);

}


/* =========================================================
   WAKE / SLEEP
========================================================= */

async function wakeUp() {

  if (!running) return;

  if (awake) return;

  awake = true;

  updateStateUI();

  setCommand(
    "E.B. 활성화"
  );

  await respond(
    "안녕하세요. 오늘은 무엇을 도와드릴까요?"
  );

}

async function sleepAssistant() {

  if (!awake) return;

  awake = false;

  updateStateUI();

  await respond(
    "휴면 상태에 돌입합니다."
  );

}


/* =========================================================
   MICROPHONE
========================================================= */

async function startAudioMonitor() {

  if (!microphoneStream) return;

  if (!audioContext) return;

  microphoneSource =
    audioContext.createMediaStreamSource(
      microphoneStream
    );

  /*
    음성 입력 5배 증폭
  */

  inputGain =
    audioContext.createGain();

  inputGain.gain.value =
    5.0;

  analyser =
    audioContext.createAnalyser();

  analyser.fftSize =
    2048;

  analyser.smoothingTimeConstant =
    0.35;

  microphoneSource.connect(
    inputGain
  );

  inputGain.connect(
    analyser
  );

  detectSoundLoop();

}

function detectSoundLoop() {

  if (!running || !analyser) {
    return;
  }

  const data =
    new Uint8Array(
      analyser.fftSize
    );

  analyser.getByteTimeDomainData(
    data
  );

  let sum = 0;

  for (
    let i = 0;
    i < data.length;
    i++
  ) {

    const value =
      (data[i] - 128) / 128;

    sum += value * value;

  }

  const rms =
    Math.sqrt(
      sum / data.length
    );

  const sound =
    document.getElementById(
      "soundDetected"
    );

  /*
    소리 표시
  */

  if (rms > 0.025) {

    if (sound) {
      sound.classList.add(
        "show"
      );
    }

  } else {

    if (sound) {
      sound.classList.remove(
        "show"
      );
    }

  }

  /*
    박수 감지
  */

  detectClap(rms);

  requestAnimationFrame(
    detectSoundLoop
  );

}


/* =========================================================
   CLAP DETECTION
========================================================= */

function detectClap(rms) {

  if (!running) return;

  /*
    휴면 상태에서만
    박수를 깨우기 신호로 사용
  */

  if (awake) return;

  const now =
    Date.now();

  /*
    강한 소리
  */

  if (rms < 0.18) {
    return;
  }

  /*
    너무 빠른 중복 방지
  */

  if (
    now - lastClapTime <
    180
  ) {
    return;
  }

  lastClapTime =
    now;

  clapCount++;

  clearTimeout(
    clapResetTimer
  );

  clapResetTimer =
    setTimeout(
      () => {
        clapCount = 0;
      },
      1000
    );

  if (clapCount >= 2) {

    clapCount = 0;

    clearTimeout(
      clapResetTimer
    );

    wakeUp();

  }

}


/* =========================================================
   SPEECH RECOGNITION
========================================================= */

function setupRecognition() {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {

    alert(
      "이 브라우저는 음성 인식을 지원하지 않습니다. Chrome 사용을 권장합니다."
    );

    return;

  }

  recognition =
    new SpeechRecognition();

  /*
    한국어 음성 인식
  */

  recognition.lang =
    "ko-KR";

  /*
    계속 듣기
  */

  recognition.continuous =
    true;

  /*
    중간 결과도 받기
  */

  recognition.interimResults =
    true;

  /*
    여러 후보를 받아서 인식 안정성 향상
  */

  recognition.maxAlternatives =
    3;


  recognition.onstart =
    () => {

      recognitionStarting =
        false;

      console.log(
        "E.B. 음성 인식 시작"
      );

    };


  recognition.onresult =
    async event => {

      if (!running) return;

      if (!awake) return;

      if (speaking) return;

      if (processing) return;

      /*
        마지막 결과만 확인
      */

      const result =
        event.results[
          event.results.length - 1
        ];

      if (!result) return;

      /*
        아직 말하는 중이면 기다림
      */

      if (!result.isFinal) {

        const interim =
          result[0]?.transcript
            ?.trim();

        if (
          interim &&
          interim.length >= 2
        ) {

          setCommand(
            "USER: " + interim
          );

        }

        return;
      }


      /*
        최종 인식 결과
      */

      let text =
        result[0]?.transcript
          ?.trim();

      if (!text) return;


      /*
        너무 짧은 잡음 무시
      */

      if (
        text.length === 1 &&
        !/[0-9]/.test(text)
      ) {

        return;

      }


      /*
        같은 문장이 짧은 시간 안에
        중복으로 들어오는 것 방지
      */

      const now =
        Date.now();

      if (
        text === lastRecognizedText &&
        now - lastRecognizedTime < 2500
      ) {

        console.log(
          "중복 음성 무시:",
          text
        );

        return;

      }

      lastRecognizedText =
        text;

      lastRecognizedTime =
        now;


      /*
        인식 결과 정리
      */

      text =
        normalizeVoiceText(text);


      console.log(
        "최종 인식:",
        text
      );

      setCommand(
        "USER: " + text
      );

      rememberUser(text);

      processing = true;

      try {

        await processCommand(
          text
        );

      } catch (error) {

        console.error(
          "명령 처리 오류:",
          error
        );

        await respond(
          "명령을 처리하는 중 오류가 발생했습니다."
        );

      } finally {

        processing =
          false;

      }

    };


  recognition.onerror =
    event => {

      console.warn(
        "음성 인식 오류:",
        event.error
      );

      recognitionStarting =
        false;

      /*
        권한 오류는 무한 재시작하지 않음
      */

      if (
        event.error === "not-allowed" ||
        event.error === "service-not-allowed"
      ) {

        return;

      }

    };


  recognition.onend =
    () => {

      recognitionStarting =
        false;

      if (!running) return;

      clearTimeout(
        recognitionRestartTimer
      );

      recognitionRestartTimer =
        setTimeout(
          startRecognition,
          350
        );

    };

}


/*
  한국어 음성 명령 정리
*/

function normalizeVoiceText(text) {

  let t =
    String(text || "")
      .trim();

  /*
    불필요한 반복 공백 제거
  */

  t =
    t.replace(
      /\s+/g,
      " "
    );

  /*
    흔한 인식 오류 보정
  */

  t =
    t.replace(
      /유투브/gi,
      "유튜브"
    );

  t =
    t.replace(
      /유튜브우/gi,
      "유튜브"
    );

  t =
    t.replace(
      /네이벌/gi,
      "네이버"
    );

  t =
    t.replace(
      /구글은/gi,
      "구글"
    );

  return t.trim();

}
function startRecognition() {

  if (!running) {
    return;
  }

  if (!recognition) {
    console.warn(
      "음성 인식 객체가 없습니다."
    );
    return;
  }

  if (recognitionStarting) {
    return;
  }

  recognitionStarting = true;

  try {

    recognition.start();

    console.log(
      "E.B. 음성 인식 시작 요청"
    );

  } catch (error) {

    recognitionStarting = false;

    console.warn(
      "음성 인식 시작 실패:",
      error
    );

    // 이미 실행 중인 경우 무시
    if (
      error.name ===
      "InvalidStateError"
    ) {
      return;
    }

    // 잠시 후 재시도
    clearTimeout(
      recognitionRestartTimer
    );

    recognitionRestartTimer =
      setTimeout(
        () => {
          if (running) {
            startRecognition();
          }
        },
        1000
      );
  }
}

function escapeHtml(value) {

    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")

}


async function searchYouTube(
  query,
  autoPlayFirst = false
) {

  const cleanQuery =
    String(query || "")
      .trim();

  if (!cleanQuery) {

    await respond(
      "검색어를 말씀해주세요."
    );

    return;

  }

  youtubeCurrentQuery =
    cleanQuery;

  rememberAction(
    "youtube-search",
    {
      search: cleanQuery,
      website: "youtube"
    }
  );

  openYouTubePanel();

  setCommand(
    "YouTube 검색: " +
    cleanQuery
  );

  try {

    await respond(
      `유튜브에서 ${cleanQuery}를 검색하겠습니다.`
    );

    const response =
      await fetch(
        "/api/youtube/search?q=" +
        encodeURIComponent(
          cleanQuery
        )
      );

    const data =
      await response.json();

    if (!response.ok) {

      throw new Error(
        data.error ||
        "YouTube 검색 실패"
      );

    }

    youtubeResults =
      Array.isArray(
        data.videos
      )
        ? data.videos
        : [];

    youtubeCurrentIndex =
      -1;

    renderYouTubeResults();

    if (
      youtubeResults.length === 0
    ) {

      await respond(
        "검색 결과를 찾지 못했습니다."
      );

      return;

    }

    if (autoPlayFirst) {

      await playYouTubeResult(
        0
      );

      return;

    }

    await respond(
      `검색 결과 ${youtubeResults.length}개를 찾았습니다. 원하는 영상 번호를 말씀해주세요.`
    );

  } catch (error) {

    console.error(
      "YouTube 검색 오류:",
      error
    );

    await respond(
      "YouTube 검색 중 오류가 발생했습니다."
    );

  }

}


function renderYouTubeResults() {

  const container =
    document.getElementById(
      "youtubeResults"
    );

  if (!container) return;

  container.innerHTML = "";

  youtubeResults.forEach(
    (video, index) => {

      const item =
        document.createElement(
          "div"
        );

      item.className =
        "youtubeResult";

      item.innerHTML = `
        <img
          src="${escapeHtml(video.thumbnail || "")}"
          alt=""
        >
        <div>
          <div class="youtubeResultTitle">
            ${index + 1}. ${escapeHtml(video.title)}
          </div>
          <div class="youtubeResultChannel">
            ${escapeHtml(video.channel || "")}
          </div>
        </div>
      `;

      item.onclick =
        () => playYouTubeResult(
          index
        );

      container.appendChild(
        item
      );

    }
  );

}


async function playYouTubeResult(
  index
) {

  if (
    !youtubeResults[index]
  ) {

    await respond(
      "해당 영상을 찾을 수 없습니다."

  }

    await respond(
      "유튜브 플레이어가 아직 준비되지 않았습니다."
    );

    return;

  }

  const video =
    youtubeResults[index];

  youtubeCurrentIndex =
    index;

  youtubePlayer.loadVideoById(
    video.videoId
  );

  rememberAction(
    "youtube-play",
    {
      search:
        youtubeCurrentQuery,
      website:
        "youtube"
    }
  );

  setCommand(
    "재생: " +

  );

}


function youtubePlay() {

  ) {

    youtubePlayer.playVideo();

  }

}

function youtubePause() {

  if (
    youtubePlayer &&
    youtubeReady
  ) {

    youtubePlayer.pauseVideo();

  }

}

function youtubeStop() {

  if (
    youtubePlayer &&
    youtubeReady
  ) {

  }

}

function youtubeVolumeUp() {

  if (
    youtubePlayer &&
    youtubeReady
  ) {

    const volume =
      youtubePlayer.getVolume();

    youtubePlayer.setVolume(
      Math.min(
        100,
        volume + 10
      )
    );

  }

}

function youtubeVolumeDown() {

  if (
    youtubePlayer &&
    youtubeReady
  ) {

    const volume =
      youtubePlayer.getVolume();

    youtubePlayer.setVolume(
      Math.max(
        0,
        volume - 10
      )
    );

  }

}

function youtubeMute() {

  if (
    youtubePlayer &&
    youtubeReady
  ) {

    youtubePlayer.mute();

  }

}

function youtubeUnmute() {

  if (
    youtubePlayer &&
    youtubeReady
  ) {

    youtubePlayer.unMute();

  }

}

function youtubeNext() {

  if (
    youtubeCurrentIndex <
    youtubeResults.length - 1
  ) {

    playYouTubeResult(
      youtubeCurrentIndex + 1
    );

  }

}

function youtubePrevious() {

  if (
    youtubeCurrentIndex > 0
  ) {

    playYouTubeResult(
      youtubeCurrentIndex - 1
    );

  }

}

/* =========================================================
   CALCULATOR
========================================================= */

function calculateExpression(
  text
) {

  let expression =
    text
      .replaceAll(
        "더하기",
        "+"
      )
      .replaceAll(
        "더해",
        "+"
      )
      .replaceAll(
        "플러스",
        "+"
      )
      .replaceAll(
        "빼기",
        "-"
      )
      .replaceAll(
        "빼",
        "-"
      )
      .replaceAll(
        "마이너스",
        "-"
      )
      .replaceAll(
        "곱하기",
        "*"
      )
      .replaceAll(
        "곱해",
        "*"
      )
      .replaceAll(
        "곱",
        "*"
      )
      .replaceAll(
        "플러스",
        "+"
      )
      .replaceAll(
        "나누기",
        "/"
      )
      .replaceAll(
        "나눠",
        "/"
      )
      .replaceAll(
        "나누어",
        "/"
      )
      .replaceAll(
        " ",
        ""
      );

  expression =
    expression.replace(
      /[^0-9+\-*/().]/g,
      ""
    );

  if (!expression) {
    return null;
  }

  /*
    eval 사용 전
    허용 문자만 남겼음
  */

  try {

    const result =
      Function(
        '"use strict"; return (' +
        expression +
        ')'
      )();

    if (
      typeof result !==
      "number" ||
      !Number.isFinite(result)
    ) {

      return null;

    }

    return result;

  } catch (_) {

    return null;

  }

}


/* =========================================================
   YOUTUBE COMMAND
========================================================= */

async function processYouTubeCommand(text) {

  const t =
    String(text || "")
      .trim();


  /* =====================================================
     1. 유튜브 사이트 열기
  ===================================================== */

  if (
    /^유튜브\s*(열어|열어줘|켜|켜줘|들어가|들어가줘)?$/i.test(t) ||
    /^유튜브 사이트\s*(열어|열어줘|켜|켜줘)?$/i.test(t)
  ) {

    rememberAction(
      "open-youtube",
      {
        website: "youtube"
      }
    );

    window.open(
      "https://www.youtube.com/",
      "_blank",
      "noopener,noreferrer"
    );

    await respond(
      "유튜브를 새 탭에서 엽니다."
    );

    return true;

  }


  /* =====================================================
     2. 번호로 영상 재생
     
     반드시 검색보다 먼저 확인
     
     예:
     가로에 있는 1번 영상 틀어줘
     1번 영상 틀어줘
     2번 틀어줘
     첫 번째 영상 틀어줘
  ===================================================== */

  if (
    youtubeResults &&
    youtubeResults.length > 0
  ) {

    let numberMatch =
      t.match(
        /(?:가로에\s*있는\s*)?(\d+)\s*(?:번|번째)(?:\s*영상)?/
      );


    /*
      첫 번째 / 첫번째
    */

    if (
      !numberMatch &&
      /첫\s*번째|첫번째/.test(t)
    ) {

      numberMatch = ["", "1"];

    }


    if (numberMatch) {

      const number =
        Number(
          numberMatch[1]
        );

      const index =
        number - 1;


      if (
        number >= 1 &&
        youtubeResults[index]
      ) {

        const video =
          youtubeResults[index];

        youtubeCurrentIndex =
          index;


        rememberAction(
          "youtube-play",
          {
            search:
              youtubeCurrentQuery,
            website:
              "youtube"
          }
        );


        const videoUrl =
          "https://www.youtube.com/watch?v=" +
          encodeURIComponent(
            video.videoId
          );


        /*
          영상 자체를 새 탭에서 실행
        */

        window.open(
          videoUrl,
          "_blank",
          "noopener,noreferrer"
        );


        setCommand(
          "재생: " +
          video.title
        );


        await respond(
          `${number}번 영상을 재생합니다.`
        );

        return true;

      }


      await respond(
        `${number}번 영상은 검색 결과에 없습니다.`
      );

      return true;

    }

  }


  /* =====================================================
     3. 유튜브 검색
     
     예:
     유튜브에서 포켓몬 검색해줘
     유튜브로 고양이 검색해줘
     유튜브 검색 마크
  ===================================================== */

  if (
    /^유튜브에서\s+/i.test(t) ||
    /^유튜브로\s+/i.test(t) ||
    /^유튜브\s+검색/i.test(t)
  ) {

    let query =
      t
        .replace(
          /^유튜브에서\s*/i,
          ""
        )
        .replace(
          /^유튜브로\s*/i,
          ""
        )
        .replace(
          /^유튜브\s*검색\s*/i,
          ""
        )
        .replace(
          /검색해줘$/i,
          ""
        )
        .replace(
          /검색해$/i,
          ""
        )
        .replace(
          /검색$/i,
          ""
        )
        .trim();


    if (!query) {

      await respond(
        "유튜브에서 무엇을 검색할까요?"
      );

      return true;

    }


    /*
      검색어 기억
    */

    youtubeCurrentQuery =
      query;

    youtubeCurrentIndex =
      -1;


    rememberAction(
      "youtube-search",
      {
        search:
          query,
        website:
          "youtube"
      }
    );


    setCommand(
      "YouTube 검색: " +
      query
    );


    try {

      /*
        먼저 서버 API에서
        실제 검색 결과 가져오기
      */

      const response =
        await fetch(
          "/api/youtube/search?q=" +
          encodeURIComponent(
            query
          )
        );


      const data =
        await response.json();


      if (!response.ok) {

        throw new Error(
          data.error ||
          "YouTube 검색 실패"
        );

      }


      youtubeResults =
        Array.isArray(
          data.videos
        )
          ? data.videos
          : [];


      if (
        youtubeResults.length === 0
      ) {

        await respond(
          `${query}의 유튜브 검색 결과를 찾지 못했습니다.`
        );

        return true;

      }


      /*
        검색 결과를 화면에도 저장
      */

      renderYouTubeResults();


      /*
        실제 YouTube 검색 페이지도
        새 탭으로 열기
      */

      const searchUrl =
        "https://www.youtube.com/results?search_query=" +
        encodeURIComponent(
          query
        );


      window.open(
        searchUrl,
        "_blank",
        "noopener,noreferrer"
      );


      await respond(
        `${query}를 유튜브에서 검색했습니다. 검색 결과 ${youtubeResults.length}개를 찾았습니다.`
      );

      return true;


    } catch (error) {

      console.error(
        "YouTube 검색 오류:",
        error
      );

      await respond(
        "유튜브 검색 중 오류가 발생했습니다."
      );

      return true;

    }

  }


  return false;

}

async function processCommand(

  const text =

  /*
    휴면
  */

  if (
    /^(쉬어|휴면|잠자|잠들어|쉬어줘|휴면해)$/.test(
      text
    )
  ) {

    await sleepAssistant();

    return;

  }

  /*
    YouTube
  */

  if (
    await processYouTubeCommand(
      text
    )
  ) {

    return;

  }

  /*
    후속 명령
  */

  if (
    await processFollowUp(
      text
    )
  ) {

    return;

  }

  /*
    시간
  */

  if (
    /몇 시|시간 알려|현재 시간|지금 시간/.test(
      text
    )
  ) {

    await tellTime();

    return;

  }

  /*
    날짜
  */

  if (
    /오늘 날짜|오늘이 며칠|며칠이야|날짜 알려|오늘 무슨 날/.test(
      text
    )
  ) {

    await tellDate();

    return;

  }

  /*
    날씨
  */

  if (
    /날씨|기온|온도|비 와|비가 와/.test(
      text
    )
  ) {

    const city =
      findCity(text) ||
      conversationMemory.lastCity ||
      "서울";

    await getWeather(
      city
    );

    return;

  }

  /*
    Google 검색
  */

  if (
    /구글에서|구글 검색|구글로 검색/.test(
      text
    )
  ) {

    const query =
      text
        .replace(
          /구글에서|구글 검색|구글로 검색/g,
          ""
        )
        .replace(
          /검색해줘|검색해|검색해|찾아줘|찾아/g,
          ""
        )
        .trim();

    if (!query) {

      await respond(
        "구글에서 무엇을 검색할까요?"
      );

      return;

    }

    googleSearch(
      query
    );

    await respond(
      `${query}를 구글에서 검색합니다.`
    );

    return;

  }

  /*
    Google 바로 열기
  */

  if (
    /구글 열어|구글 켜|구글 들어가|구글 사이트/.test(
      text
    )
  ) {

    openWebsite(
      "https://www.google.com/"
    );

    await respond(
      "구글을 엽니다."
    );

    return;

  }

  /*
    Naver
  */

  if (
    /네이버에서|네이버 검색/.test(
      text
    )
  ) {

    const query =
      text
        .replace(
          /네이버에서|네이버 검색/g,
          ""
        )
        .replace(
          /검색해줘|검색해|찾아줘|찾아/g,
          ""
        )
        .trim();

    if (!query) {

      openWebsite(
        "https://www.naver.com/"
      );

      await respond(
        "네이버를 엽니다."
      );

      return;

    }

    naverSearch(
      query
    );

    await respond(
      `${query}를 네이버에서 검색합니다.`
    );

    return;

  }

  /*
    계산
  */

  if (
    /계산해|계산/.test(text) ||
    /\d+\s*(더하기|빼기|곱하기|나누기)\s*\d+/.test(text)
  ) {

    const result =
      calculateExpression(
        text
      );

    if (
      result !== null
    ) {

      await respond(
        "계산 결과는 " +
        result +
        "입니다."
      );

      return;

    }

  }

  /*
    기억
  */

  if (
    /내가 뭐라고|방금 뭐라고|마지막으로 뭐라고|기억해/.test(
      text
    )
  ) {

    if (
      conversationMemory.lastUserText
    ) {

      await respond(
        "마지막으로 말씀하신 내용은 " +
        conversationMemory.lastUserText +
        "입니다."
      );

    } else {

      await respond(
        "아직 기억할 대화가 없습니다."
      );

    }

    return;

  }

  /*
    이름
  */

  if (
    /너 이름|이름이 뭐|누구야|누구니/.test(
      text
    )
  ) {

    await respond(
      "저는 이비입니다."
    );

    return;

  }

  /*
    인사
  */

  if (
    /안녕|반가워|좋은 아침|좋은 저녁/.test(
      text
    )
  ) {

    await respond(
      "안녕하세요. 저는 이비입니다."
    );

    return;

  }

  /*
    감사
  */

  if (
    /고마워|감사해|감사합니다/.test(
      text
    )
  ) {

    await respond(
      "도움이 되었다면 다행입니다."
    );

    return;

  }

  /*
    YouTube 바로가기
  */

  if (
    /유튜브 열어|유튜브 켜/.test(
      text
    )
  ) {

    openWebsite(
      "https://www.youtube.com/"
    );

    await respond(
      "유튜브를 엽니다."
    );

    return;

  }

  /*
    Google 바로가기
  */

  if (
    /인터넷 열어|브라우저 열어/.test(
      text
    )
  ) {

    openWebsite(
      "https://www.google.com/"
    );

    await respond(
      "브라우저 검색 페이지를 엽니다."
    );

    return;

  }

  /*
    일반 대화
  */

  if (
    text.includes("잘 지내") ||
    text.includes("뭐해")
  ) {

    await respond(
      "현재 대기 중입니다. 필요한 명령을 말씀해주세요."
    );

    return;

  }

  /*
    알 수 없는 명령
  */

  await respond(
    `"${text}" 명령은 아직 처리 방법을 찾지 못했습니다.`
  );

}


/* =========================================================
   START
========================================================= */

async function startAssistant() {

  if (running) return;

  try {

    setCommand("마이크 권한 요청 중...");

    // 마이크 기능 자체 확인
    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {
      throw new Error(
        "이 브라우저에서는 마이크 기능을 사용할 수 없습니다."
      );
    }

    // 마이크 권한 요청
    microphoneStream =
      await navigator.mediaDevices.getUserMedia({
        audio: true
      });

    console.log(
      "마이크 연결 성공:",
      microphoneStream
    );

    // AudioContext
    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    if (!AudioContext) {
      throw new Error(
        "AudioContext를 지원하지 않습니다."
      );
    }

    audioContext =
      new AudioContext();

    await audioContext.resume();

    // 실행 상태
    running = true;
    awake = false;

    loadMemory();
    updateStateUI();

    // 음성 인식 설정
    setupRecognition();

    // 마이크 소리 감지
    await startAudioMonitor();

    // 음성 인식 시작
    startRecognition();

    setCommand(
      "E.B. 대기 중 · 두 번 박수로 활성화"
    );

    console.log(
      "E.B. STARTED"
    );

  } catch (error) {

    console.error(
      "E.B. 시작 오류:",
      error
    );

    running = false;

    // 마이크 정리
    if (microphoneStream) {

      microphoneStream
        .getTracks()
        .forEach(
          track => track.stop()
        );

      microphoneStream = null;
    }

    if (audioContext) {

      try {
        await audioContext.close();
      } catch (_) {}

      audioContext = null;
    }

    setCommand(
      "마이크 시작 실패: " +
      (error.name || "") +
      " " +
      (error.message || "")
    );

    alert(
      "마이크를 시작할 수 없습니다.\n\n" +
      "오류: " +
      (error.name || "UnknownError") +
      "\n" +
      (error.message || "") +
      "\n\n" +
      "Chrome 주소창 왼쪽의 🔒 아이콘 → 마이크 → 허용으로 설정한 뒤 새로고침해주세요."
    );
  }
}

   GLOBAL EXPORTS
========================================================= */

console.log(
  "E.B. Voice Core loaded."
);

})();
