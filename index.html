<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이비</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(circle at center, #10284a 0%, #06111f 45%, #02060c 100%);
  color: #dff7ff;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
}

.container {
  width: min(900px, 94vw);
  padding: 25px;
}

.hud {
  border: 1px solid #287da8;
  border-radius: 24px;
  background: rgba(2, 12, 24, 0.88);
  box-shadow:
    0 0 40px rgba(0, 160, 255, .15),
    inset 0 0 40px rgba(0, 100, 180, .08);
  padding: 25px;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #164c68;
  padding-bottom: 18px;
}

.logo {
  font-size: 32px;
  font-weight: bold;
  letter-spacing: 4px;
  color: #8eeaff;
}

.status {
  font-size: 13px;
  color: #65e7a4;
}

.orb-area {
  text-align: center;
  padding: 35px 0 25px;
}

.orb {
  width: 170px;
  height: 170px;
  margin: auto;
  border-radius: 50%;
  background:
    radial-gradient(circle at 35% 30%, #ffffff, #69ddff 10%, #187ab0 38%, #082238 68%, #020812 100%);
  box-shadow:
    0 0 20px #38cfff,
    0 0 60px rgba(0, 195, 255, .5),
    inset 0 0 35px #0a8ec8;
  animation: pulse 2.5s infinite;
}

.orb.awake {
  animation: awake 1s infinite alternate;
  box-shadow:
    0 0 30px #48e6ff,
    0 0 100px rgba(0, 220, 255, .75),
    inset 0 0 40px #00bfff;
}

@keyframes pulse {
  50% {
    transform: scale(1.04);
  }
}

@keyframes awake {
  from {
    transform: scale(1);
  }
  to {
    transform: scale(1.09);
  }
}

.mode {
  margin-top: 20px;
  font-size: 20px;
  font-weight: bold;
}

.sub {
  margin-top: 8px;
  color: #6e9db1;
  font-size: 13px;
}

.log {
  height: 260px;
  overflow-y: auto;
  border: 1px solid #17445e;
  border-radius: 14px;
  padding: 15px;
  background: rgba(0, 5, 12, .7);
}

.message {
  margin-bottom: 12px;
  line-height: 1.5;
}

.user {
  color: #83dfff;
}

.eb {
  color: #75ffb5;
}

.system {
  color: #7893a3;
}

.controls {
  display: flex;
  gap: 10px;
  margin-top: 15px;
}

input {
  flex: 1;
  min-width: 0;
  background: #071522;
  border: 1px solid #23627e;
  color: white;
  padding: 13px;
  border-radius: 10px;
  outline: none;
}

button {
  border: 1px solid #2a82a9;
  background: #0b2638;
  color: #c8f5ff;
  padding: 12px 18px;
  border-radius: 10px;
  cursor: pointer;
}

button:hover {
  background: #103c55;
}

.buttons {
  display: flex;
  gap: 10px;
  margin-top: 12px;
  flex-wrap: wrap;
}

.clap {
  text-align: center;
  margin-top: 15px;
  min-height: 22px;
  color: #ffd76a;
}
</style>
</head>

<body>

<div class="container">
  <div class="hud">

    <header>
      <div class="logo">이비</div>
      <div class="status" id="status">● 휴면 상태</div>
    </header>

    <div class="orb-area">
      <div class="orb" id="orb"></div>

      <div class="mode" id="mode">
        휴면 상태
      </div>

      <div class="sub" id="sub">
        👏 두 번 박수치면 이비가 깨어납니다.
      </div>
    </div>

    <div class="log" id="log"></div>

    <div class="controls">
      <input
        id="command"
        placeholder="직접 명령 입력..."
        autocomplete="off"
      >
      <button onclick="manualCommand()">전송</button>
    </div>

    <div class="buttons">
      <button onclick="startAssistant()">🎙️ 마이크 시작</button>
      <button onclick="testVoice()">🔊 음성 테스트</button>
      <button onclick="goSleep()">💤 휴면</button>
    </div>

    <div class="clap" id="clap"></div>

  </div>
</div>

<script>

let awake = false;
let recognition = null;
let listening = false;

let audioContext = null;
let analyser = null;
let microphone = null;
let clapTimer = null;
let lastClap = 0;

const $ = id => document.getElementById(id);

function log(text, type = "system") {
  const div = document.createElement("div");
  div.className = "message " + type;
  div.textContent = text;

  $("log").appendChild(div);
  $("log").scrollTop = $("log").scrollHeight;
}

function setAwake(value) {

  awake = value;

  $("orb").classList.toggle("awake", value);

  if (value) {
    $("status").textContent = "● 활성 상태";
    $("status").style.color = "#75ffb5";

    $("mode").textContent = "이비 활성화";
    $("sub").textContent =
      "“이비” 또는 “이비야”라고 말한 뒤 명령하세요.";

  } else {

    $("status").textContent = "● 휴면 상태";
    $("status").style.color = "#65e7a4";

    $("mode").textContent = "휴면 상태";
    $("sub").textContent =
      "👏 두 번 박수치면 이비가 깨어납니다.";
  }
}


/* =========================
   음성 출력
========================= */

async function speak(text) {

  log("이비: " + text, "eb");

  try {

    /*
      서버 TTS가 있으면 먼저 사용
    */

    const response = await fetch(
      "/api/tts",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          text
        })
      }
    );

    if (response.ok) {

      const blob = await response.blob();

      const url = URL.createObjectURL(blob);

      const audio = new Audio(url);

      audio.onended = () => {
        URL.revokeObjectURL(url);
      };

      await audio.play();

      return;
    }

  } catch (error) {

    console.log(
      "서버 TTS를 사용할 수 없습니다.",
      error
    );

  }

  /*
    서버 TTS가 없을 경우
    브라우저 음성으로 대체
  */

  if (!("speechSynthesis" in window)) {
    return;
  }

  speechSynthesis.cancel();

  const utterance =
    new SpeechSynthesisUtterance(text);

  utterance.lang = "ko-KR";
  utterance.rate = 0.88;
  utterance.pitch = 0.72;
  utterance.volume = 1;

  const voices =
    speechSynthesis.getVoices();

  const korean =
    voices.find(v =>
      v.lang &&
      v.lang.toLowerCase().startsWith("ko")
    );

  if (korean) {
    utterance.voice = korean;
  }

  speechSynthesis.speak(utterance);
}


/* =========================
   명령 처리
========================= */

async function processCommand(rawText) {

  const text =
    rawText
      .trim()
      .replace(/[,.!?]/g, " ");

  if (!text) return;

  log("사용자: " + rawText, "user");

  /*
    휴면 명령
  */

  if (
    /^(이비\s*)?(쉬어|쉬어줘|휴면|잠들어|대기해|잠자|자러가)/i.test(text)
  ) {

    await speak(
      "휴면 상태에 돌입합니다."
    );

    setAwake(false);

    return;
  }

  /*
    이름 질문
  */

  if (
    /(네 이름|이름이 뭐|누구야|너 누구)/.test(text)
  ) {

    await speak(
      "제 이름은 이비입니다."
    );

    return;
  }

  /*
    안녕
  */

  if (
    /(안녕|반가워|하이|헬로)/.test(text)
  ) {

    await speak(
      "안녕하세요. 오늘은 무엇을 도와드릴까요?"
    );

    return;
  }

  /*
    시간
  */

  if (
    /(몇 시|시간|현재 시간|지금 시간)/.test(text)
  ) {

    try {

      const response =
        await fetch("/api/time");

      const data =
        await response.json();

      const time =
        data.korean ||
        data.text ||
        data.time ||
        "현재 시간을 확인하지 못했습니다.";

      await speak(
        "현재 시간은 " + time + "입니다."
      );

    } catch {

      const now =
        new Date();

      const time =
        new Intl.DateTimeFormat(
          "ko-KR",
          {
            timeZone: "Asia/Seoul",
            hour: "numeric",
            minute: "numeric"
          }
        ).format(now);

      await speak(
        "현재 시간은 " + time + "입니다."
      );
    }

    return;
  }

  /*
    날짜
  */

  if (
    /(오늘 날짜|오늘 며칠|몇 월 며칠|날짜)/.test(text)
  ) {

    const today =
      new Intl.DateTimeFormat(
        "ko-KR",
        {
          timeZone: "Asia/Seoul",
          dateStyle: "full"
        }
      ).format(new Date());

    await speak(
      "오늘은 " + today + "입니다."
    );

    return;
  }

  /*
    날씨
  */

  if (
    /(날씨|기온|온도|비 와|비가 와|춥|더워)/.test(text)
  ) {

    let city = "서울";

    const match =
      text.match(
        /([가-힣]+)\s*(?:날씨|기온|온도)/
      );

    if (match) {
      city = match[1];
    }

    try {

      const response =
        await fetch(
          "/api/weather?city=" +
          encodeURIComponent(city)
        );

      const data =
        await response.json();

      if (!response.ok) {
        throw new Error();
      }

      if (data.current) {

        const temperature =
          data.current.temperature_2m;

        const feels =
          data.current.apparent_temperature;

        await speak(
          `${data.city || city}의 현재 기온은 ${temperature}도이고, 체감온도는 ${feels}도입니다.`
        );

      } else {

        await speak(
          `${city}의 날씨 정보를 확인했습니다.`
        );
      }

    } catch {

      await speak(
        "날씨 정보를 가져오지 못했습니다."
      );
    }

    return;
  }

  /*
    유튜브
  */

  if (
    /(유튜브|youtube)/i.test(text)
  ) {

    window.open(
      "https://www.youtube.com",
      "_blank"
    );

    await speak(
      "유튜브를 열겠습니다."
    );

    return;
  }

  /*
    네이버
  */

  if (
    /(네이버|naver)/i.test(text)
  ) {

    window.open(
      "https://www.naver.com",
      "_blank"
    );

    await speak(
      "네이버를 열겠습니다."
    );

    return;
  }

  /*
    구글
  */

  if (
    /(구글|google)/i.test(text)
  ) {

    window.open(
      "https://www.google.com",
      "_blank"
    );

    await speak(
      "구글을 열겠습니다."
    );

    return;
  }

  /*
    검색
  */

  const searchMatch =
    text.match(
      /(?:검색해줘|검색해|검색|찾아줘|찾아)\s*(.+)/
    );

  if (searchMatch) {

    const query =
      searchMatch[1].trim();

    if (query) {

      window.open(
        "https://www.google.com/search?q=" +
        encodeURIComponent(query),
        "_blank"
      );

      await speak(
        `${query}을 검색하겠습니다.`
      );

      return;
    }
  }

  /*
    계산
  */

  const calcMatch =
    text.match(
      /(?:계산해줘|계산|얼마야)\s*([0-9+\-*/().\s]+)/ 
    );

  if (calcMatch) {

    try {

      const expression =
        calcMatch[1];

      if (
        /^[0-9+\-*/().\s]+$/.test(expression)
      ) {

        const result =
          Function(
            `"use strict"; return (${expression})`
          )();

        await speak(
          `계산 결과는 ${result}입니다.`
        );

        return;
      }

    } catch {}
  }

  /*
    고마워
  */

  if (
    /(고마워|감사해|땡큐)/.test(text)
  ) {

    await speak(
      "천만에요. 더 필요한 것이 있으면 말씀해주세요."
    );

    return;
  }

  /*
    도움말
  */

  if (
    /(뭐 할 수 있어|무엇을 할 수|도와줄 수|기능)/.test(text)
  ) {

    await speak(
      "시간과 날짜 확인, 날씨 확인, 검색, 웹사이트 열기, 간단한 계산과 일반적인 대화를 도와드릴 수 있습니다."
    );

    return;
  }

  /*
    아무 명령도 해당되지 않았을 때
  */

  await speak(
    `"${rawText}"라고 말씀하셨군요. 아직 그 명령은 배우지 못했지만 계속해서 기능을 추가할 수 있습니다.`
  );
}


/* =========================
   이비 호출어 처리
========================= */

function handleRecognizedSpeech(text) {

  if (!text) return;

  console.log(
    "음성 인식:",
    text
  );

  /*
    휴면 상태에서는
    음성 명령을 절대 실행하지 않음
  */

  if (!awake) {

    /*
      단, 이비 호출어가 들어와도
      휴면에서는 실행하지 않음.
      깨우기는 박수만 담당.
    */

    return;
  }

  const normalized =
    text
      .trim()
      .replace(/\s+/g, " ");

  /*
    이비 호출어 찾기
  */

  const wakeRegex =
    /^(?:이비|이비야|에비|에비야|이피|이피야)[,\s]*(.*)$/i;

  const match =
    normalized.match(wakeRegex);

  if (match) {

    const command =
      match[1].trim();

    /*
      "이비"만 말한 경우
    */

    if (!command) {

      speak(
        "네. 말씀하세요."
      );

      return;
    }

    processCommand(command);

    return;
  }

  /*
    음성 인식이 "이비 지금 몇 시야"
    같은 식으로 붙여버리는 경우 대응
  */

  const containsWake =
    normalized.match(
      /(?:^|\s)(이비야?|에비야?|이피야?)\s*(.*)$/i
    );

  if (containsWake) {

    const command =
      containsWake[2].trim();

    if (command) {
      processCommand(command);
    } else {
      speak("네. 말씀하세요.");
    }

    return;
  }

}


/* =========================
   음성 인식 시작
========================= */

let recognition = null;
let recognitionRunning = false;
let recognitionRestartTimer = null;
let lastRecognizedText = "";
let lastRecognizedTime = 0;

function startRecognition() {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {

    log(
      "이 브라우저에서는 음성 인식을 지원하지 않습니다.",
      "system"
    );

    return;
  }

  // 기존 인식기 제거
  if (recognition) {
    try {
      recognition.onend = null;
      recognition.onerror = null;
      recognition.stop();
    } catch {}
  }

  recognition =
    new SpeechRecognition();

  /*
    핵심 설정
  */

  recognition.lang = "ko-KR";

  recognition.continuous = true;

  recognition.interimResults = true;

  recognition.maxAlternatives = 10;

  /*
    인식 결과
  */

  recognition.onresult = function(event) {

    let finalText = "";

    for (
      let i = event.resultIndex;
      i < event.results.length;
      i++
    ) {

      const result =
        event.results[i];

      /*
        중간 인식 결과도 가져오지만
        실제 명령 실행은 final 결과에서만
      */

      if (result.isFinal) {

        /*
          여러 후보 중 첫 번째 사용
        */

        const text =
          result[0]?.transcript
            ?.trim();

        if (text) {
          finalText += " " + text;
        }
      }
    }

    finalText =
      finalText.trim();

    if (!finalText) return;

    /*
      같은 문장을 반복해서 인식하는 현상 방지
    */

    const now =
      Date.now();

    if (
      finalText === lastRecognizedText &&
      now - lastRecognizedTime < 2500
    ) {
      return;
    }

    lastRecognizedText = finalText;
    lastRecognizedTime = now;

    console.log(
      "🎙️ 최종 인식:",
      finalText
    );

    handleRecognizedSpeech(
      finalText
    );
  };


  /*
    인식 시작
  */

  recognition.onstart = function() {

    recognitionRunning = true;

    console.log(
      "🎙️ 이비 음성 인식 시작"
    );
  };


  /*
    오류가 나도 절대 포기하지 않음
  */

  recognition.onerror = function(event) {

    console.log(
      "음성 인식 오류:",
      event.error
    );

    recognitionRunning = false;

    /*
      정상적으로 다시 시작할 수 있는
      오류들은 전부 재시작
    */

    restartRecognition(100);
  };


  /*
    브라우저가 음성 인식을
    멋대로 종료하는 경우
  */

  recognition.onend = function() {

    recognitionRunning = false;

    restartRecognition(100);
  };


  try {

    recognition.start();

  } catch (error) {

    console.log(
      "음성 인식 시작 실패:",
      error
    );

    restartRecognition(300);
  }
}


/*
  음성 인식 자동 재시작
*/

function restartRecognition(delay = 100) {

  if (recognitionRestartTimer) {
    clearTimeout(
      recognitionRestartTimer
    );
  }

  recognitionRestartTimer =
    setTimeout(() => {

      if (!recognition) return;

      try {

        recognition.start();

        recognitionRunning = true;

      } catch {

        /*
          이미 실행 중이면 무시.
          실행 중이 아니면 다시 시도.
        */

        recognitionRunning = false;

        restartRecognition(500);
      }

    }, delay);
}

/* =========================
   마이크 + 박수 감지
========================= */

async function startAssistant() {

  try {

    const stream =
      await navigator.mediaDevices.getUserMedia({
        audio: {
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true,
          channelCount: 1
        }
      });

    log(
      "🎙️ 마이크가 연결되었습니다.",
      "system"
    );

    startRecognition();

    setupClapDetection(stream);

  } catch (error) {

    console.error(error);

    log(
      "마이크 권한을 허용해주세요.",
      "system"
    );
  }
}


/* =========================
   박수 감지
========================= */

function setupClapDetection(stream) {

  try {

    audioContext =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

    analyser =
      audioContext.createAnalyser();

    analyser.fftSize = 2048;

    analyser.smoothingTimeConstant = 0.08;

    microphone =
      audioContext.createMediaStreamSource(stream);

    microphone.connect(analyser);

    const data =
      new Float32Array(
        analyser.fftSize
      );

    function detect() {

      analyser.getFloatTimeDomainData(data);

      let sum = 0;
      let max = 0;

      for (let i = 0; i < data.length; i++) {

        const value =
          Math.abs(data[i]);

        sum += value * value;

        if (value > max) {
          max = value;
        }
      }

      const rms =
        Math.sqrt(
          sum / data.length
        );

      /*
        박수는 짧고 강한 소리만 인정
      */

      if (
        !awake &&
        max > 0.72 &&
        rms > 0.18
      ) {

        const now =
          Date.now();

        if (
          now - lastClap >
          500
        ) {

          lastClap = now;

          detectClap();
        }
      }

      requestAnimationFrame(detect);
    }

    detect();

  } catch (error) {

    console.error(
      "박수 감지 오류",
      error
    );
  }
}


function detectClap() {

  const now =
    Date.now();

  if (
    clapTimer &&
    now - clapTimer < 1400
  ) {

    /*
      두 번째 박수
    */

    clearTimeout(clapTimer);

    clapTimer = null;

    wakeUp();

    return;
  }

  /*
    첫 번째 박수
  */

  clapTimer = now;

  setTimeout(() => {

    if (
      clapTimer === now
    ) {
      clapTimer = null;
    }

  }, 1400);
}


/* =========================
   깨우기
========================= */

async function wakeUp() {

  if (awake) return;

  setAwake(true);

  $("clap").textContent =
    "👏👏 감지";

  setTimeout(() => {
    $("clap").textContent = "";
  }, 1500);

  await speak(
    "안녕하세요. 오늘은 무엇을 도와드릴까요?"
  );
}


/* =========================
   휴면
========================= */

async function goSleep() {

  if (!awake) return;

  speechSynthesis.cancel();

  setAwake(false);

  await speak(
    "휴면 상태에 돌입합니다."
  );
}


/* =========================
   직접 입력
========================= */

function manualCommand() {

  const input =
    $("command");

  const text =
    input.value.trim();

  if (!text) return;

  input.value = "";

  /*
    직접 입력은 이비 호출어 없이도
    바로 명령 실행
  */

  processCommand(text);
}

$("command").addEventListener(
  "keydown",
  event => {

    if (event.key === "Enter") {
      manualCommand();
    }
  }
);


/* =========================
   음성 테스트
========================= */

function testVoice() {

  speak(
    "안녕하세요. 저는 이비입니다. 음성 시스템이 정상적으로 작동하고 있습니다."
  );
}

window.addEventListener(

  () => {

    setAwake(false);

    log(

    );

    log(
      "휴면 상태입니다. 👏👏 두 번 박수쳐 주세요.",
      "system"
    );
  }
);
