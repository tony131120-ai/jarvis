<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>이비</title>


<style>

* {

  box-sizing:
    border-box;

}


html,
body {

  width:
    100%;

  height:
    100%;

  margin:
    0;

  overflow:
    hidden;

  background:
    #02070d;

  font-family:
    Arial,
    sans-serif;

}


body {

  color:
    #bdeeff;

}


#app {

  position:
    fixed;

  inset:
    0;

  overflow:
    hidden;

  background:

    radial-gradient(
      circle at 50% 50%,
      rgba(
        0,
        120,
        190,
        .15
      ),
      transparent 32%
    ),

    radial-gradient(
      circle at 50% 50%,
      #06131f 0%,
      #02070d 55%,
      #000 100%
    );

}


/* =========================================================
   HUD GRID
========================================================= */

#grid {

  position:
    absolute;

  inset:
    0;

  opacity:
    .20;

  background-image:

    linear-gradient(
      rgba(
        70,
        190,
        255,
        .08
      ) 1px,
      transparent 1px
    ),

    linear-gradient(
      90deg,
      rgba(
        70,
        190,
        255,
        .08
      ) 1px,
      transparent 1px
    );

  background-size:
    70px 70px;

  mask-image:
    radial-gradient(
      circle,
      black 0%,
      transparent 75%
    );

}


/* =========================================================
   TOP HUD
========================================================= */

#top {

  position:
    absolute;

  top:
    24px;

  left:
    30px;

  right:
    30px;

  display:
    flex;

  justify-content:
    space-between;

  align-items:
    center;

  z-index:
    20;

}


.brand {

  display:
    flex;

  align-items:
    center;

  gap:
    10px;

}


.brandDot {

  width:
    9px;

  height:
    9px;

  border-radius:
    50%;

  background:
    #55d9ff;

  box-shadow:
    0 0 15px
    #36c8ff;

}


.brandText {

  font-size:
    18px;

  font-weight:
    600;

  letter-spacing:
    5px;

  color:
    rgba(
      180,
      235,
      255,
      .9
    );

}


.status {

  font-size:
    10px;

  letter-spacing:
    3px;

  color:
    rgba(
      120,
      210,
      255,
      .55
    );

}


/* =========================================================
   SIDE HUD
========================================================= */

.side {

  position:
    absolute;

  top:
    50%;

  transform:
    translateY(-50%);

  width:
    170px;

  height:
    270px;

  opacity:
    .38;

}


#left {

  left:
    25px;

}


#right {

  right:
    25px;

}


.side::before {

  content:
    "";

  position:
    absolute;

  inset:
    0;

  border-top:
    1px solid
    rgba(
      80,
      200,
      255,
      .18
    );

  border-bottom:
    1px solid
    rgba(
      80,
      200,
      255,
      .18
    );

}


.sideLine {

  position:
    absolute;

  width:
    100%;

  height:
    1px;

  background:
    rgba(
      80,
      200,
      255,
      .15
    );

}


.sideLine:nth-child(1) {

  top:
    25%;

}


.sideLine:nth-child(2) {

  top:
    50%;

}


.sideLine:nth-child(3) {

  top:
    75%;

}


/* =========================================================
   CENTRAL CORE
========================================================= */

#center {

  position:
    absolute;

  left:
    50%;

  top:
    50%;

  width:
    430px;

  height:
    430px;

  transform:
    translate(
      -50%,
      -50%
    );

  display:
    flex;

  align-items:
    center;

  justify-content:
    center;

}


/* =========================================================
   ROTATING RINGS
========================================================= */

.ring {

  position:
    absolute;

  left:
    50%;

  top:
    50%;

  border-radius:
    50%;

  transform:
    translate(
      -50%,
      -50%
    );

  border:
    1px solid
    rgba(
      50,
      190,
      255,
      .25
    );

}


.ring1 {

  width:
    250px;

  height:
    250px;

  animation:
    rotate1
    18s
    linear
    infinite;

}


.ring2 {

  width:
    310px;

  height:
    310px;

  border-style:
    dashed;

  border-color:
    rgba(
      60,
      200,
      255,
      .18
    );

  animation:
    rotate2
    25s
    linear
    infinite;

}


.ring3 {

  width:
    375px;

  height:
    375px;

  border:
    1px solid
    rgba(
      60,
      180,
      255,
      .10
    );

  animation:
    rotate1
    35s
    linear
    infinite;

}


@keyframes rotate1 {

  from {

    transform:
      translate(
        -50%,
        -50%
      )
      rotate(0deg);

  }

  to {

    transform:
      translate(
        -50%,
        -50%
      )
      rotate(360deg);

  }

}


@keyframes rotate2 {

  from {

    transform:
      translate(
        -50%,
        -50%
      )
      rotate(360deg);

  }

  to {

    transform:
      translate(
        -50%,
        -50%
      )
      rotate(0deg);

  }

}


/* =========================================================
   CORE
========================================================= */

#core {

  position:
    relative;

  width:
    130px;

  height:
    130px;

  border-radius:
    50%;

  background:

    radial-gradient(
      circle at 35% 30%,
      #d9fbff 0%,
      #66dfff 8%,
      #159bdf 25%,
      #07558b 48%,
      #021c32 72%,
      #000 100%
    );

  box-shadow:

    0 0 20px
    rgba(
      50,
      205,
      255,
      .8
    ),

    0 0 55px
    rgba(
      20,
      160,
      255,
      .55
    ),

    0 0 110px
    rgba(
      10,
      120,
      220,
      .35
    );

  z-index:
    10;

  transition:
    transform .08s
    ease-out;

}


/* =========================================================
   CORE INNER
========================================================= */

#core::before {

  content:
    "";

  position:
    absolute;

  inset:
    17px;

  border-radius:
    50%;

  border:
    1px solid
    rgba(
      190,
      245,
      255,
      .55
    );

  box-shadow:
    inset
    0 0 25px
    rgba(
      80,
      210,
      255,
      .45
    );

}


#core::after {

  content:
    "";

  position:
    absolute;

  inset:
    38px;

  border-radius:
    50%;

  background:
    rgba(
      210,
      250,
      255,
      .75
    );

  box-shadow:
    0 0 25px
    rgba(
      150,
      240,
      255,
      .9
    );

  opacity:
    .75;

}


/* =========================================================
   AURA
========================================================= */

.aura {

  position:
    absolute;

  left:
    50%;

  top:
    50%;

  width:
    140px;

  height:
    140px;

  transform:
    translate(
      -50%,
      -50%
    );

  border-radius:
    50%;

  border:
    1px solid
    rgba(
      60,
      200,
      255,
      .35
    );

  pointer-events:
    none;

}


#aura1 {

  box-shadow:
    0 0 40px
    rgba(
      30,
      180,
      255,
      .35
    );

}


#aura2 {

  width:
    190px;

  height:
    190px;

  opacity:
    .5;

}


#aura3 {

  width:
    260px;

  height:
    260px;

  opacity:
    .25;

}


/* =========================================================
   LISTENING
========================================================= */

.listening #core {

  box-shadow:

    0 0 25px
    #36caff,

    0 0 65px
    rgba(
      30,
      190,
      255,
      .85
    ),

    0 0 140px
    rgba(
      30,
      160,
      255,
      .45
    );

}


/* =========================================================
   SPEAKING
========================================================= */

.speaking #core {

  box-shadow:

    0 0 35px
    #9aeaff,

    0 0 90px
    rgba(
      80,
      220,
      255,
      1
    ),

    0 0 170px
    rgba(
      50,
      180,
      255,
      .65
    );

}


/* =========================================================
   SLEEP
========================================================= */

.sleep #core {

  transform:
    scale(.68);

  opacity:
    .55;

  box-shadow:

    0 0 12px
    rgba(
      30,
      130,
      190,
      .25
    );

}


.sleep .ring {

  opacity:
    .25;

}


/* =========================================================
   WAKE
========================================================= */

.waking #core {

  animation:
    wakeCore
    1s
    ease-in-out
    infinite;

}


@keyframes wakeCore {

  0% {

    transform:
      scale(.65);

  }

  50% {

    transform:
      scale(1.12);

  }

  100% {

    transform:
      scale(.65);

  }

}


/* =========================================================
   SOUND DETECTED
========================================================= */

#soundDetected {

  position:
    fixed;

  top:
    72px;

  right:
    30px;

  padding:
    7px 11px;

  border:
    1px solid
    rgba(
      70,
      200,
      255,
      .35
    );

  border-radius:
    4px;

  background:
    rgba(
      5,
      25,
      40,
      .72
    );

  color:
    rgba(
      160,
      230,
      255,
      .9
    );

  font-size:
    10px;

  letter-spacing:
    2px;

  opacity:
    0;

  transform:
    translateY(
      -6px
    );

  transition:
    .15s ease;

  pointer-events:
    none;

  z-index:
    100;

}


#soundDetected.show {

  opacity:
    1;

  transform:
    translateY(0);

}


/* =========================================================
   BOTTOM HUD
========================================================= */

#bottom {

  position:
    absolute;

  bottom:
    25px;

  left:
    30px;

  right:
    30px;

  display:
    flex;

  justify-content:
    space-between;

  align-items:
    center;

  z-index:
    20;

}


.bottomLine {

  width:
    110px;

  height:
    1px;

  background:
    rgba(
      70,
      200,
      255,
      .25
    );

}


.bottomCenter {

  position:
    absolute;

  left:
    50%;

  transform:
    translateX(
      -50%
    );

  width:
    80px;

  height:
    2px;

  background:
    rgba(
      90,
      215,
      255,
      .45
    );

  box-shadow:
    0 0 12px
    rgba(
      60,
      200,
      255,
      .45
    );

}


/* =========================================================
   START
========================================================= */

#start {

  position:
    fixed;

  bottom:
    10px;

  left:
    50%;

  transform:
    translateX(
      -50%
    );

  width:
    100px;

  height:
    30px;

  opacity:
    .01;

  background:
    transparent;

  border:
    0;

  color:
    transparent;

  cursor:
    pointer;

  z-index:
    200;

}


/* =========================================================
   MOBILE
========================================================= */

@media (
  max-width: 700px
) {

  #center {

    width:
      330px;

    height:
      330px;

  }


  .ring1 {

    width:
      200px;

    height:
      200px;

  }


  .ring2 {

    width:
      250px;

    height:
      250px;

  }


  .ring3 {

    width:
      300px;

    height:
      300px;

  }


  #left,
  #right {

    display:
      none;

  }


  .brandText {

    font-size:
      14px;

  }

}

</style>

</head>


<body>


<div id="app">


  <div id="grid"></div>


  <div id="top">

    <div class="brand">

      <div class="brandDot"></div>

      <div class="brandText">
        E.B.
      </div>

    </div>

    <div class="status">
      VOICE CORE
    </div>

  </div>


  <div
    id="left"
    class="side"
  >

    <div class="sideLine"></div>
    <div class="sideLine"></div>
    <div class="sideLine"></div>

  </div>


  <div
    id="right"
    class="side"
  >

    <div class="sideLine"></div>
    <div class="sideLine"></div>
    <div class="sideLine"></div>

  </div>


  <div
    id="center"
    class="sleep"
  >

    <div class="ring ring1"></div>

    <div class="ring ring2"></div>

    <div class="ring ring3"></div>


    <div
      id="aura1"
      class="aura"
    ></div>

    <div
      id="aura2"
      class="aura"
    ></div>

    <div
      id="aura3"
      class="aura"
    ></div>


    <div id="core"></div>

  </div>


  <div
    id="soundDetected"
  >
    소리 감지됨
  </div>


  <div id="bottom">

    <div class="bottomLine"></div>

    <div class="bottomCenter"></div>

    <div class="bottomLine"></div>

  </div>


</div>


<button
  id="start"
  onclick="startAssistant()"
>
시작
</button>


<script>

/* =========================================================
   E.B. CORE STATE
========================================================= */

let running = false;
let awake = false;
let speaking = false;
let processing = false;

let recognition = null;
let recognitionStarting = false;
let restartTimer = null;

let microphoneStream = null;
let audioContext = null;
let analyser = null;
let microphoneSource = null;

let audioData = null;
let frequencyData = null;

let clapCount = 0;
let clapResetTimer = null;

let currentAudio = null;


/* =========================================================
   CONVERSATION MEMORY
========================================================= */

const defaultMemory = {
  lastUserText: "",
  lastAssistantText: "",

  lastAction: "",
  lastWebsite: "",
  lastCity: "",
  lastSearch: "",

  lastTopic: "",

  history: []
};


let conversationMemory = {
  ...defaultMemory
};


/* =========================================================
   LOAD MEMORY
========================================================= */

try {

  const saved =
    localStorage.getItem(
      "EB_CONVERSATION_MEMORY"
    );

  if (saved) {

    const parsed =
      JSON.parse(saved);

    conversationMemory = {
      ...defaultMemory,
      ...parsed
    };

  }

}
catch (error) {

  console.warn(
    "대화 기억 불러오기 실패:",
    error
  );

}


/* =========================================================
   SAVE MEMORY
========================================================= */

function saveMemory() {

  try {

    localStorage.setItem(
      "EB_CONVERSATION_MEMORY",
      JSON.stringify(
        conversationMemory
      )
    );

  }
  catch (error) {

    console.warn(
      "대화 기억 저장 실패:",
      error
    );

  }

}


/* =========================================================
   REMEMBER
========================================================= */

function rememberUser(text) {

  conversationMemory.lastUserText =
    text;

  conversationMemory.history.push({
    role: "user",
    text: text,
    time: Date.now()
  });


  if (
    conversationMemory.history.length > 12
  ) {

    conversationMemory.history =
      conversationMemory.history.slice(-12);

  }


  saveMemory();

}


function rememberAssistant(text) {

  conversationMemory.lastAssistantText =
    text;

  conversationMemory.history.push({
    role: "assistant",
    text: text,
    time: Date.now()
  });


  if (
    conversationMemory.history.length > 12
  ) {

    conversationMemory.history =
      conversationMemory.history.slice(-12);

  }


  saveMemory();

}


/* =========================================================
   ACTION MEMORY
========================================================= */

function rememberAction(
  action,
  data = {}
) {

  conversationMemory.lastAction =
    action;


  if (
    data.website !== undefined
  ) {

    conversationMemory.lastWebsite =
      data.website;

  }


  if (
    data.city !== undefined
  ) {

    conversationMemory.lastCity =
      data.city;

  }


  if (
    data.search !== undefined
  ) {

    conversationMemory.lastSearch =
      data.search;

  }


  if (
    data.topic !== undefined
  ) {

    conversationMemory.lastTopic =
      data.topic;

  }


  saveMemory();

}


/* =========================================================
   ELEMENTS
========================================================= */

const app =
  document.getElementById("app");

const center =
  document.getElementById("center");

const core =
  document.getElementById("core");

const aura1 =
  document.getElementById("aura1");

const aura2 =
  document.getElementById("aura2");

const aura3 =
  document.getElementById("aura3");

const soundDetected =
  document.getElementById(
    "soundDetected"
  );


/* =========================================================
   START
========================================================= */

async function startAssistant() {

  if (running) {

    console.log(
      "E.B. already running."
    );

    return;

  }


  try {

    console.log(
      "E.B. 마이크 시작"
    );


    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      throw new Error(
        "이 브라우저에서는 마이크를 사용할 수 없습니다."
      );

    }


    microphoneStream =
      await navigator.mediaDevices.getUserMedia({

        audio: {

          echoCancellation: false,

          noiseSuppression: false,

          autoGainControl: false

        }

      });


    console.log(
      "마이크 권한 획득 성공"
    );


    audioContext =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();


    if (
      audioContext.state ===
      "suspended"
    ) {

      await audioContext.resume();

    }


    analyser =
      audioContext.createAnalyser();


    analyser.fftSize =
      2048;


    analyser.smoothingTimeConstant =
      0.08;


    microphoneSource =
      audioContext.createMediaStreamSource(
        microphoneStream
      );


    microphoneSource.connect(
      analyser
    );


    audioData =
      new Uint8Array(
        analyser.fftSize
      );


    frequencyData =
      new Uint8Array(
        analyser.frequencyBinCount
      );


    running = true;

    awake = false;

    speaking = false;

    processing = false;


    startVisualizer();

    startClapDetection();

    setupRecognition();


    setState(
      "sleep"
    );


    console.log(
      "E.B. 시작 완료"
    );

  }

  catch (error) {

    console.error(
      "마이크 실행 실패:",
      error
    );


    alert(
      "마이크를 실행할 수 없습니다.\n\n" +
      "브라우저의 마이크 권한을 확인해주세요.\n\n" +
      "오류: " +
      error.message
    );

  }

}


window.startAssistant =
  startAssistant;


/* =========================================================
   STATE
========================================================= */

function setState(state) {

  center.classList.remove(
    "sleep",
    "listening",
    "speaking",
    "waking"
  );


  center.classList.add(
    state
  );

}


/* =========================================================
   VISUALIZER
========================================================= */

function startVisualizer() {

  if (!analyser) {
    return;
  }


  function draw() {

    if (!running) {
      return;
    }


    analyser.getByteTimeDomainData(
      audioData
    );


    let sum = 0;


    for (
      let i = 0;
      i < audioData.length;
      i++
    ) {

      const value =
        (
          audioData[i] - 128
        ) / 128;


      sum +=
        value * value;

    }


    const rms =
      Math.sqrt(
        sum / audioData.length
      );


    let strength =
      Math.min(
        1,
        rms * 10
      );


    if (speaking) {

      strength =
        Math.max(
          strength,
          0.18
        );

    }


    const coreScale =
      1 +
      strength * 0.28;


    const s1 =
      1 +
      strength;


    const s2 =
      1 +
      strength * 1.8;


    const s3 =
      1 +
      strength * 2.6;


    if (
      !center.classList.contains(
        "sleep"
      )
    ) {

      core.style.transform =
        `scale(${coreScale})`;

    }


    aura1.style.transform =
      `translate(-50%, -50%) scale(${s1})`;


    aura2.style.transform =
      `translate(-50%, -50%) scale(${s2})`;


    aura3.style.transform =
      `translate(-50%, -50%) scale(${s3})`;


    aura1.style.opacity =
      0.18 +
      strength * 0.55;


    aura2.style.opacity =
      0.08 +
      strength * 0.35;


    aura3.style.opacity =
      0.04 +
      strength * 0.22;


    requestAnimationFrame(
      draw
    );

  }


  draw();

}


/* =========================================================
   SPEECH RECOGNITION
========================================================= */

function setupRecognition() {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if (!SpeechRecognition) {

    console.warn(
      "SpeechRecognition을 지원하지 않는 브라우저입니다."
    );

    return;

  }


  recognition =
    new SpeechRecognition();


  recognition.lang =
    "ko-KR";


  recognition.continuous =
    true;


  recognition.interimResults =
    true;


  recognition.maxAlternatives =
    5;


  recognition.onstart =
    () => {

      recognitionStarting =
        false;

      console.log(
        "음성 인식 시작"
      );

    };


  recognition.onresult =
    handleSpeech;


  recognition.onerror =
    event => {

      recognitionStarting =
        false;


      console.warn(
        "SPEECH ERROR:",
        event.error
      );


      if (
        event.error ===
        "not-allowed"
      ) {

        return;

      }


      scheduleRecognition();

    };


  recognition.onend =
    () => {

      recognitionStarting =
        false;

      scheduleRecognition();

    };


  startRecognition();

}


/* =========================================================
   START RECOGNITION
========================================================= */

function startRecognition() {

  if (
    !running ||
    !recognition ||
    speaking ||
    recognitionStarting
  ) {

    return;

  }


  recognitionStarting =
    true;


  try {

    recognition.start();

  }

  catch {

    recognitionStarting =
      false;

  }

}


/* =========================================================
   RESTART RECOGNITION
========================================================= */

function scheduleRecognition() {

  if (
    !running ||
    speaking
  ) {

    return;

  }


  clearTimeout(
    restartTimer
  );


  restartTimer =
    setTimeout(
      () => {

        startRecognition();

      },
      700
    );

}


/* =========================================================
   SPEECH RESULT
========================================================= */

function handleSpeech(event) {

  if (
    !awake ||
    speaking
  ) {

    return;

  }


  let finalText =
    "";


  for (
    let i = event.resultIndex;
    i < event.results.length;
    i++
  ) {

    if (
      event.results[i].isFinal
    ) {

      finalText +=
        event.results[i][0]
          .transcript;

    }

  }


  finalText =
    finalText.trim();


  if (!finalText) {
    return;
  }


  console.log(
    "USER:",
    finalText
  );


  processCommand(
    finalText
  );

}


/* =========================================================
   COMMAND PROCESSOR
========================================================= */

async function processCommand(raw) {

  if (processing) {
    return;
  }


  processing = true;


  let text =
    normalize(raw);


  text =
    removeWakeWord(text);


  if (!text) {

    processing = false;

    await speak(
      "네. 말씀하세요."
    );

    return;

  }


  rememberUser(
    text
  );


  /* =====================================================
     SLEEP
  ===================================================== */

  if (
    text.includes("쉬어") ||
    text.includes("휴면") ||
    text.includes("잠자") ||
    text.includes("절전") ||
    text === "자"
  ) {

    sleepAssistant();

    return;

  }


  /* =====================================================
     CONTEXTUAL COMMANDS
  ===================================================== */

  if (
    isFollowUpCommand(text)
  ) {

    const handled =
      await handleFollowUp(
        text
      );


    if (handled) {

      return;

    }

  }


  /* =====================================================
     GREETING
  ===================================================== */

  if (
    text.includes("안녕") ||
    text.includes("하이") ||
    text.includes("헬로")
  ) {

    await respond(
      "안녕하세요."
    );

    return;

  }


  /* =====================================================
     NAME
  ===================================================== */

  if (
    text.includes("이름") &&
    (
      text.includes("뭐") ||
      text.includes("무엇")
    )
  ) {

    await respond(
      "제 이름은 이비입니다."
    );

    rememberAction(
      "name"
    );

    return;

  }


  /* =====================================================
     TIME
  ===================================================== */

  if (
    text.includes("몇 시") ||
    text.includes("시간") ||
    text.includes("현재 시각")
  ) {

    const now =
      new Date();


    const result =
      `현재 시간은 ${now.getHours()}시 ${now.getMinutes()}분입니다.`;


    rememberAction(
      "time"
    );


    await respond(
      result
    );

    return;

  }


  /* =====================================================
     DATE
  ===================================================== */

  if (
    (
      text.includes("오늘") ||
      text.includes("날짜")
    ) &&
    (
      text.includes("날짜") ||
      text.includes("며칠") ||
      text.includes("몇일")
    )
  ) {

    const now =
      new Date();


    const result =
      `오늘은 ${now.getFullYear()}년 ` +
      `${now.getMonth() + 1}월 ` +
      `${now.getDate()}일입니다.`;


    rememberAction(
      "date"
    );


    await respond(
      result
    );

    return;

  }


  /* =====================================================
     WEATHER
  ===================================================== */

  if (
    text.includes("날씨") ||
    text.includes("기온") ||
    text.includes("온도")
  ) {

    let city =
      getCity(
        text
      );


    /*
      도시를 말하지 않았으면
      이전 도시를 사용
    */

    if (
      !hasCity(text) &&
      conversationMemory.lastCity
    ) {

      city =
        conversationMemory.lastCity;

    }


    rememberAction(
      "weather",
      {
        city
      }
    );


    await respond(
      `${city}의 날씨를 확인하겠습니다.`
    );


    try {

      const response =
        await fetch(
          "/api/weather?city=" +
          encodeURIComponent(
            city
          )
        );


      if (!response.ok) {

        throw new Error(
          `HTTP ${response.status}`
        );

      }


      const data =
        await response.json();


      if (
        data.temperature !== undefined
      ) {

        const result =
          `${data.city}의 현재 날씨는 ` +
          `${data.description}입니다. ` +
          `현재 기온은 ${data.temperature}도이고 ` +
          `체감 온도는 ${data.feelsLike}도입니다. ` +
          `습도는 ${data.humidity}퍼센트입니다.`;


        await respond(
          result
        );

      }

      else if (
        data.current
      ) {

        const current =
          data.current;


        const condition =
          weatherText(
            current.weather_code
          );


        await respond(
          `${city}의 현재 날씨는 ${condition}이고 ` +
          `기온은 ${current.temperature_2m}도입니다. ` +
          `체감온도는 ${current.apparent_temperature}도입니다.`
        );

      }

      else {

        throw new Error(
          "날씨 데이터 형식 오류"
        );

      }

    }

    catch (error) {

      console.error(
        "날씨 조회 실패:",
        error
      );


      await respond(
        "현재 날씨 정보를 가져오지 못했습니다."
      );

    }


    return;

  }


  /* =====================================================
     YOUTUBE
  ===================================================== */

  if (
    text.includes("유튜브")
  ) {

    const url =
      "https://www.youtube.com";


    rememberAction(
      "website",
      {
        website: "youtube"
      }
    );


    await respond(
      "유튜브를 열겠습니다."
    );


    openSite(
      url
    );


    return;

  }


  /* =====================================================
     NAVER
  ===================================================== */

  if (
    text.includes("네이버")
  ) {

    rememberAction(
      "website",
      {
        website: "naver"
      }
    );


    await respond(
      "네이버를 열겠습니다."
    );


    openSite(
      "https://www.naver.com"
    );


    return;

  }


  /* =====================================================
     GOOGLE
  ===================================================== */

  if (
    text.includes("구글")
  ) {

    rememberAction(
      "website",
      {
        website: "google"
      }
    );


    await respond(
      "구글을 열겠습니다."
    );


    openSite(
      "https://www.google.com"
    );


    return;

  }


  /* =====================================================
     SEARCH
  ===================================================== */

  if (
    text.startsWith("검색") ||
    text.startsWith("찾아")
  ) {

    let query =
      extractSearchQuery(
        text
      );


    if (!query) {

      processing = false;

      await speak(
        "무엇을 검색할까요?"
      );

      return;

    }


    rememberAction(
      "search",
      {
        search: query,
        website:
          conversationMemory.lastWebsite ||
          "google"
      }
    );


    await executeSearch(
      query
    );


    return;

  }


  /* =====================================================
     CALCULATOR
  ===================================================== */

  if (
    text.includes("계산") ||
    text.includes("더하기") ||
    text.includes("빼기") ||
    text.includes("곱하기") ||
    text.includes("나누기") ||
    text.includes("곱해") ||
    text.includes("더해") ||
    text.includes("빼") ||
    text.includes("나눠")
  ) {

    const result =
      calculate(
        text
      );


    rememberAction(
      "calculator"
    );


    if (
      result !== null
    ) {

      await respond(
        `계산 결과는 ${result}입니다.`
      );

    }

    else {

      await respond(
        "계산식을 정확하게 이해하지 못했습니다."
      );

    }


    return;

  }


  /* =====================================================
     FEATURES
  ===================================================== */

  if (
    text.includes("뭐 할 수 있어") ||
    text.includes("무엇을 할 수 있어") ||
    text.includes("기능")
  ) {

    await respond(
      "시간, 날짜, 날씨, 검색, 유튜브와 웹사이트 열기, 계산 등을 할 수 있습니다. 그리고 앞에서 나눈 말의 맥락도 기억합니다."
    );

    rememberAction(
      "features"
    );

    return;

  }


  /* =====================================================
     THANKS
  ===================================================== */

  if (
    text.includes("고마워") ||
    text.includes("감사해") ||
    text.includes("감사합니다")
  ) {

    await respond(
      "천만에요."
    );

    return;

  }


  /* =====================================================
     WHAT DID WE TALK ABOUT
  ===================================================== */

  if (
    text.includes("아까") ||
    text.includes("전에") ||
    text.includes("방금 뭐")
  ) {

    const last =
      conversationMemory.lastUserText;


    if (last) {

      await respond(
        `방금 말씀하신 내용은 "${last}"입니다.`
      );

    }

    else {

      await respond(
        "아직 기억하고 있는 대화가 없습니다."
      );

    }


    return;

  }


  /* =====================================================
     GENERIC CONTEXT RESPONSE
  ===================================================== */

  rememberAction(
    "conversation",
    {
      topic: text
    }
  );


  await respond(
    contextualResponse(
      text
    )
  );

}


/* =========================================================
   FOLLOW-UP DETECTION
========================================================= */

function isFollowUpCommand(text) {

  return (

    text.includes("그럼") ||
    text.includes("그러면") ||
    text.includes("거기") ||
    text.includes("그곳") ||
    text.includes("거기는") ||
    text.includes("거기서") ||
    text.includes("그것도") ||
    text.includes("그것") ||
    text.includes("다시") ||
    text === "내일" ||
    text === "오늘은" ||
    text === "그럼?" ||
    text.length <= 8

  );

}


/* =========================================================
   FOLLOW-UP HANDLER
========================================================= */

async function handleFollowUp(text) {

  const lastAction =
    conversationMemory.lastAction;


  /* -------------------------------------------------------
     이전 사이트에서 검색
  ------------------------------------------------------- */

  if (
    (
      text.includes("거기서") ||
      text.includes("거기") ||
      text.includes("그 사이트")
    ) &&
    (
      text.includes("검색") ||
      text.includes("찾아")
    )
  ) {

    const query =
      extractSearchQuery(
        text
      );


    if (!query) {

      processing = false;

      await speak(
        "무엇을 검색할까요?"
      );

      return true;

    }


    await executeSearch(
      query
    );


    return true;

  }


  /* -------------------------------------------------------
     유튜브에서 이어서 검색
  ------------------------------------------------------- */

  if (
    (
      text.includes("검색") ||
      text.includes("찾아")
    ) &&
    conversationMemory.lastWebsite ===
      "youtube"
  ) {

    const query =
      extractSearchQuery(
        text
      );


    if (query) {

      await executeSearch(
        query,
        "youtube"
      );

      return true;

    }

  }


  /* -------------------------------------------------------
     이전 검색 다시
  ------------------------------------------------------- */

  if (
    (
      text.includes("다시") ||
      text.includes("또")
    ) &&
    conversationMemory.lastSearch
  ) {

    await executeSearch(
      conversationMemory.lastSearch
    );


    return true;

  }


  /* -------------------------------------------------------
     이전 지역 기억
  ------------------------------------------------------- */

  if (
    (
      text.includes("거기는") ||
      text.includes("그럼 거기") ||
      text.includes("그곳")
    ) &&
    conversationMemory.lastCity
  ) {

    if (
      lastAction ===
      "weather"
    ) {

      const city =
        conversationMemory.lastCity;


      await getWeather(
        city
      );


      return true;

    }

  }


  /* -------------------------------------------------------
     "그럼?" + 이전 날씨
  ------------------------------------------------------- */

  if (
    (
      text === "그럼" ||
      text === "그러면" ||
      text === "그럼?"
    ) &&
    lastAction ===
      "weather"
  ) {

    await getWeather(
      conversationMemory.lastCity ||
      "서울"
    );


    return true;

  }


  /* -------------------------------------------------------
     지역만 말했을 때
     예: "그럼 용인은?"
  ------------------------------------------------------- */

  if (
    lastAction === "weather" &&
    hasCity(text)
  ) {

    const city =
      getCity(text);


    await getWeather(
      city
    );


    return true;

  }


  /* -------------------------------------------------------
     "내일?" 같은 후속 질문
  ------------------------------------------------------- */

  if (
    (
      text === "내일" ||
      text === "내일은"
    ) &&
    lastAction ===
      "weather"
  ) {

    await respond(
      `${conversationMemory.lastCity || "서울"}의 내일 날씨를 확인하려면 내일 예보 기능이 필요합니다. 현재 날씨 기능은 실시간 날씨를 조회합니다.`
    );


    return true;

  }


  /* -------------------------------------------------------
     이전 검색 주제
  ------------------------------------------------------- */

  if (
    (
      text.includes("그것") ||
      text.includes("그거")
    ) &&
    conversationMemory.lastSearch
  ) {

    await respond(
      `방금 검색한 "${conversationMemory.lastSearch}"를 기준으로 말씀하시는 것으로 이해했습니다.`
    );


    return true;

  }


  return false;

}


/* =========================================================
   WEATHER
========================================================= */

async function getWeather(city) {

  rememberAction(
    "weather",
    {
      city
    }
  );


  await respond(
    `${city}의 날씨를 확인하겠습니다.`
  );


  try {

    const response =
      await fetch(
        "/api/weather?city=" +
        encodeURIComponent(
          city
        )
      );


    if (!response.ok) {

      throw new Error(
        `HTTP ${response.status}`
      );

    }


    const data =
      await response.json();


    if (
      data.temperature !== undefined
    ) {

      await respond(
        `${data.city}의 현재 날씨는 ` +
        `${data.description}입니다. ` +
        `현재 기온은 ${data.temperature}도이고 ` +
        `체감 온도는 ${data.feelsLike}도입니다. ` +
        `습도는 ${data.humidity}퍼센트입니다.`
      );

    }

    else if (
      data.current
    ) {

      const current =
        data.current;


      await respond(
        `${city}의 현재 날씨는 ` +
        `${weatherText(
          current.weather_code
        )}이고 ` +
        `기온은 ${current.temperature_2m}도입니다.`
      );

    }

    else {

      throw new Error(
        "날씨 데이터 형식 오류"
      );

    }

  }

  catch (error) {

    console.error(
      "날씨 오류:",
      error
    );


    await respond(
      "날씨 정보를 가져오지 못했습니다."
    );

  }

}


/* =========================================================
   SEARCH
========================================================= */

async function executeSearch(
  query,
  forcedWebsite = null
) {

  query =
    query.trim();


  if (!query) {

    processing = false;

    await speak(
      "무엇을 검색할까요?"
    );

    return;

  }


  const website =
    forcedWebsite ||
    conversationMemory.lastWebsite ||
    "google";


  rememberAction(
    "search",
    {
      search: query,
      website
    }
  );


  await respond(
    `${query}를 검색하겠습니다.`
  );


  let url;


  if (
    website === "youtube"
  ) {

    url =
      "https://www.youtube.com/results?search_query=" +
      encodeURIComponent(
        query
      );

  }

  else if (
    website === "naver"
  ) {

    url =
      "https://search.naver.com/search.naver?query=" +
      encodeURIComponent(
        query
      );

  }

  else {

    url =
      "https://www.google.com/search?q=" +
      encodeURIComponent(
        query
      );

  }


  openSite(
    url
  );

}


/* =========================================================
   SEARCH QUERY EXTRACTION
========================================================= */

function extractSearchQuery(text) {

  let query =
    text
      .replace(
        /^(검색해줘|검색해|검색|찾아줘|찾아|거기서|거기)/g,
        ""
      )
      .trim();


  query =
    query
      .replace(
        /검색해줘$/g,
        ""
      )
      .trim();


  query =
    query
      .replace(
        /검색해$/g,
        ""
      )
      .trim();


  return query;

}


/* =========================================================
   CONTEXTUAL RESPONSE
========================================================= */

function contextualResponse(text) {

  const last =
    conversationMemory.lastUserText;


  if (
    last &&
    conversationMemory.lastAction ===
      "weather"
  ) {

    return (
      `${conversationMemory.lastCity || "서울"}에 대해 계속 말씀하시는 것으로 이해했습니다.`
    );

  }


  if (
    conversationMemory.lastSearch
  ) {

    return (
      `"${conversationMemory.lastSearch}"에 이어서 말씀하시는 것으로 이해했습니다.`
    );

  }


  return (
    `"${text}"라고 말씀하셨습니다. 제가 실행할 수 있는 명령인지 확인해볼게요.`
  );

}


/* =========================================================
   CITY
========================================================= */

const cityList = [

  "서울",
  "수원",
  "용인",
  "인천",
  "부산",
  "대전",
  "대구",
  "광주",
  "울산",
  "제주",
  "청주",
  "전주",
  "춘천",
  "강릉",
  "포항"

];


function hasCity(text) {

  return cityList.some(
    city =>
      text.includes(city)
  );

}


function getCity(text) {

  for (
    const city of cityList
  ) {

    if (
      text.includes(city)
    ) {

      return city;

    }

  }


  return (
    conversationMemory.lastCity ||
    "서울"
  );

}


/* =========================================================
   RESPOND
========================================================= */

function respond(text) {

  rememberAssistant(
    text
  );


  processing = false;


  return new Promise(
    resolve => {

      speak(
        text,
        resolve
      );

    }
  );

}


/* =========================================================
   SPEAK
========================================================= */

async function speak(
  text,
  done
) {

  speaking = true;


  setState(
    "speaking"
  );


  if (recognition) {

    try {

      recognition.stop();

    }

    catch {}

  }


  try {

    const response =
      await fetch(
        "/api/tts",
        {

          method: "POST",

          headers: {

            "Content-Type":
              "application/json"

          },

          body:
            JSON.stringify({
              text
            })

        }
      );


    if (response.ok) {

      const blob =
        await response.blob();


      const url =
        URL.createObjectURL(
          blob
        );


      const audio =
        new Audio(
          url
        );


      currentAudio =
        audio;


      audio.volume =
        1;


      audio.onended =
        () => {

          URL.revokeObjectURL(
            url
          );


          currentAudio =
            null;


          finishSpeaking(
            done
          );

        };


      audio.onerror =
        () => {

          URL.revokeObjectURL(
            url
          );


          currentAudio =
            null;


          browserSpeak(
            text,
            done
          );

        };


      await audio.play();


      return;

    }

  }

  catch (error) {

    console.warn(
      "SERVER TTS FAILED:",
      error
    );

  }


  browserSpeak(
    text,
    done
  );

}


/* =========================================================
   BROWSER SPEECH
========================================================= */

function browserSpeak(
  text,
  done
) {

  try {

    speechSynthesis.cancel();


    const voices =
      speechSynthesis.getVoices();


    let voice =
      voices.find(
        v =>
          v.lang === "ko-KR" &&
          /female|여성|woman/i.test(
            v.name
          )
      );


    if (!voice) {

      voice =
        voices.find(
          v =>
            v.lang === "ko-KR"
        );

    }


    const utterance =
      new SpeechSynthesisUtterance(
        text
      );


    utterance.lang =
      "ko-KR";


    if (voice) {

      utterance.voice =
        voice;

    }


    utterance.rate =
      0.88;


    utterance.pitch =
      0.82;


    utterance.volume =
      1;


    utterance.onend =
      () => {

        finishSpeaking(
          done
        );

      };


    utterance.onerror =
      () => {

        finishSpeaking(
          done
        );

      };


    speechSynthesis.speak(
      utterance
    );

  }

  catch {

    finishSpeaking(
      done
    );

  }

}


/* =========================================================
   FINISH SPEAKING
========================================================= */

function finishSpeaking(done) {

  speaking = false;


  if (awake) {

    setState(
      "listening"
    );

  }

  else {

    setState(
      "sleep"
    );

  }


  if (done) {

    done();

  }


  scheduleRecognition();

}


/* =========================================================
   WAKE
========================================================= */

function wakeUp() {

  if (
    !running ||
    awake
  ) {

    return;

  }


  awake = true;


  clapCount = 0;


  clearTimeout(
    clapResetTimer
  );


  setState(
    "waking"
  );


  setTimeout(
    () => {

      if (!awake) {
        return;
      }


      setState(
        "listening"
      );

    },
    1000
  );


  speak(
    "안녕하세요. 오늘은 무엇을 도와드릴까요?"
  );

}


/* =========================================================
   SLEEP
========================================================= */

function sleepAssistant() {

  awake = false;

  processing = false;

  clapCount = 0;


  clearTimeout(
    clapResetTimer
  );


  setState(
    "sleep"
  );


  speak(
    "휴면 상태에 돌입합니다."
  );

}


/* =========================================================
   CLAP DETECTION
========================================================= */

function startClapDetection() {

  if (!analyser) {
    return;
  }


  const timeData =
    new Float32Array(
      analyser.fftSize
    );


  let previousRms = 0;

  let lastClapTime = 0;


  function detect() {

    if (!running) {
      return;
    }


    analyser.getFloatTimeDomainData(
      timeData
    );


    let sum = 0;

    let peak = 0;


    for (
      let i = 0;
      i < timeData.length;
      i++
    ) {

      const value =
        Math.abs(
          timeData[i]
        );


      peak =
        Math.max(
          peak,
          value
        );


      sum +=
        value * value;

    }


    const rms =
      Math.sqrt(
        sum /
        timeData.length
      );


    analyser.getByteFrequencyData(
      frequencyData
    );


    let total = 0;

    let high = 0;


    for (
      let i = 0;
      i < frequencyData.length;
      i++
    ) {

      const value =
        frequencyData[i];


      total +=
        value;


      if (
        i >
        frequencyData.length * 0.20
      ) {

        high +=
          value;

      }

    }


    const highRatio =
      total > 0
        ? high / total
        : 0;


    const sudden =
      previousRms > 0.002
        ? rms / previousRms
        : 0;


    previousRms =
      previousRms * 0.70 +
      rms * 0.30;


    const now =
      performance.now();


    const clap =
      !awake &&
      !speaking &&
      peak > 0.12 &&
      rms > 0.008 &&
      (
        sudden > 1.35 ||
        (
          peak > 0.20 &&
          highRatio > 0.10
        )
      ) &&
      now -
      lastClapTime >
      300;


    if (clap) {

      lastClapTime =
        now;


      showSoundDetected();


      clapCount++;


      console.log(
        "박수 감지:",
        clapCount,
        "peak:",
        peak.toFixed(3),
        "rms:",
        rms.toFixed(3),
        "high:",
        highRatio.toFixed(3)
      );


      clearTimeout(
        clapResetTimer
      );


      clapResetTimer =
        setTimeout(
          () => {

            clapCount =
              0;

          },
          1800
        );


      if (
        clapCount >= 2
      ) {

        clapCount =
          0;


        clearTimeout(
          clapResetTimer
        );


        wakeUp();

      }

    }


    requestAnimationFrame(
      detect
    );

  }


  detect();

}


/* =========================================================
   SOUND DETECTED
========================================================= */

function showSoundDetected() {

  soundDetected.classList.add(
    "show"
  );


  clearTimeout(
    soundDetected._timer
  );


  soundDetected._timer =
    setTimeout(
      () => {

        soundDetected.classList.remove(
          "show"
        );

      },
      700
    );

}


/* =========================================================
   CALCULATOR
========================================================= */

function calculate(text) {

  let expression =
    text
      .replace(
        /계산/g,
        ""
      )
      .replace(
        /더하기/g,
        "+"
      )
      .replace(
        /빼기/g,
        "-"
      )
      .replace(
        /곱하기/g,
        "*"
      )
      .replace(
        /나누기/g,
        "/"
      )
      .replace(
        /곱해/g,
        "*"
      )
      .replace(
        /더해/g,
        "+"
      )
      .replace(
        /빼/g,
        "-"
      )
      .replace(
        /나눠/g,
        "/"
      )
      .replace(
        /[^0-9+\-*/().]/g,
        ""
      );


  if (!expression) {
    return null;
  }


  if (
    !/^[0-9+\-*/().\s]+$/.test(
      expression
    )
  ) {

    return null;

  }


  try {

    const result =
      Function(
        '"use strict";return(' +
        expression +
        ")"
      )();


    if (
      typeof result !==
        "number" ||
      !Number.isFinite(
        result
      )
    ) {

      return null;

    }


    return Math.round(
      result * 100000
    ) / 100000;

  }

  catch {

    return null;

  }

}


/* =========================================================
   OPEN SITE
========================================================= */

function openSite(url) {

  setTimeout(
    () => {

      window.open(
        url,
        "_blank"
      );

    },
    300
  );

}


/* =========================================================
   WAKE WORD
========================================================= */

function removeWakeWord(text) {

  return text
    .replace(
      /^(이비야|이비|에비야|에비|이피야|이피)\s*/i,
      ""
    )
    .trim();

}


/* =========================================================
   NORMALIZE
========================================================= */

function normalize(text) {

  return String(
    text || ""
  )
    .toLowerCase()
    .replace(
      /[.,!?~。！？]/g,
      " "
    )
    .replace(
      /\s+/g,
      " "
    )
    .trim();

}
