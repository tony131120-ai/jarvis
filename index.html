<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EVI Voice Assistant</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 35%,#12395b,#071624 35%,#02070c 75%);color:#dff9ff;font-family:Arial,"Noto Sans KR",sans-serif}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.12;background-image:linear-gradient(#61d9ff 1px,transparent 1px),linear-gradient(90deg,#61d9ff 1px,transparent 1px);background-size:50px 50px}.app{width:min(1000px,94vw);margin:auto;padding:28px 0 50px}.top{display:flex;justify-content:space-between;align-items:center}.logo{font-size:25px;font-weight:800;letter-spacing:7px}.status{color:#73e8ff;font-size:13px}.hud{margin-top:28px;display:grid;grid-template-columns:1fr 250px 1fr;gap:18px;align-items:center}.side,.console{border:1px solid #1c6075;background:#06131ddd;box-shadow:0 0 30px #00b7ff18 inset;padding:20px}.side{min-height:190px}.side h3,.label{margin:0 0 14px;color:#6fe9ff;font-size:12px;letter-spacing:2px}.data{font-size:14px;line-height:2;color:#b9d9e3}.core{width:230px;height:230px;margin:auto;border-radius:50%;border:2px solid #59e4ff;position:relative;display:flex;align-items:center;justify-content:center;box-shadow:0 0 18px #36dfff,0 0 60px #00aaff44,inset 0 0 40px #00aaff22}.core:before,.core:after{content:"";position:absolute;border-radius:50%;border:1px solid #3bcff4}.core:before{inset:18px;animation:spin 7s linear infinite}.core:after{inset:42px;border-style:dashed;animation:spin 4s linear infinite reverse}.orb{width:72px;height:72px;border-radius:50%;background:#bdf7ff;box-shadow:0 0 15px #fff,0 0 50px #00d9ff;animation:pulse 1.8s ease-in-out infinite}.controls{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:28px 0}button{border:1px solid #42d9ff;background:#06202d;color:#cfffff;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer}button:hover{background:#0a3547}button.main{border-radius:50%;width:120px;height:120px;font-size:15px;box-shadow:0 0 35px #00d9ff55}button.active{background:#0c4e61;box-shadow:0 0 40px #00d9ff88}.console{min-height:150px}.label{font-size:11px}#message{font-size:21px;line-height:1.5;margin-top:8px}.input{display:flex;gap:10px;margin-top:14px}input{flex:1;background:#06131c;border:1px solid #235a6b;color:#fff;padding:12px;border-radius:8px;outline:0}.list{max-height:140px;overflow:auto;font-size:12px}.item{padding:7px 0;border-bottom:1px solid #123746}.help{margin-top:18px;color:#7399a6;font-size:12px;line-height:1.7}@keyframes pulse{50%{transform:scale(1.13);opacity:.72}}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:760px){.hud{grid-template-columns:1fr}.core{grid-row:1}.side{min-height:130px}}
</style>
</head>
<body>
<div class="app">
<div class="top"><div class="logo">EVI</div><div id="status" class="status">대기 중</div></div>
<div class="hud">
<section class="side"><h3>SYSTEM</h3><div class="data">마이크: <span id="mic">확인 중</span><br>음성 인식: <span id="speech">대기</span><br>모드: <span id="mode">SLEEP</span><br>박수 감지: <span id="clap">대기</span></div></section>
<div class="core"><div class="orb"></div></div>
<section class="side"><h3>COMMAND LOG</h3><div id="history" class="list"></div></section>
</div>
<div class="controls"><button id="startBtn" class="main">마이크<br>시작</button><button id="sleepBtn">휴면</button><button id="testBtn">음성 테스트</button></div>
<div class="console"><div class="label">EVI OUTPUT</div><div id="message">마이크 시작을 누르면 준비합니다.</div><div class="input"><input id="manual" placeholder="마이크가 안 될 때 직접 명령 입력"><button id="send">실행</button></div></div>
<div class="help">마이크를 시작한 뒤 <b>👏 박수를 빠르게 2번</b> 치세요. 활성화되면 음성 명령을 받습니다.<br>예: "현재 시간", "서울 날씨", "마인크래프트 검색해줘", "쉬어"</div>
</div>
<script>
const $ = id => document.getElementById(id);
let recognition=null, recognitionAvailable=false, listening=false, running=false;
let awake=false, micStream=null, audioContext=null, analyser=null;
let history=[]; let wakeBuffer=""; let wakeTimer=null; let speaking=false;
const WAKE_WORDS=["이비","이비야","에이비","j비스","자비스","EVI"];

function say(text){
  $("message").textContent=text;
  speaking=true;
  if("speechSynthesis" in window){
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text); u.lang="ko-KR"; u.rate=.96; u.pitch=.9;
    u.onend=()=>{speaking=false; if(awake) restartRecognition(250);};
    speechSynthesis.speak(u);
  } else { speaking=false; }
}
function log(t){history.unshift(t);history=history.slice(0,15);$("history").innerHTML=history.map(x=>`<div class="item">${escapeHtml(x)}</div>`).join("");}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;", "'":"&#39;"}[c]));}
function setMode(v){awake=v;$("mode").textContent=v?"ACTIVE":"SLEEP";$("status").textContent=v?"대화 대기 중":"휴면 상태";}

function normalize(t){
  return t.toLowerCase().replace(/[.,!?]/g," ").replace(/\s+/g," ").trim();
}
function findWake(t){
  const n=normalize(t);
  for(const w of WAKE_WORDS){ if(n.includes(w)) return w; }
  return null;
}
function removeWake(t){
  let n=normalize(t);
  for(const w of WAKE_WORDS){ n=n.replace(w," "); }
  return n.replace(/\s+/g," ").trim();
}

function setupRecognition(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){$("speech").textContent="지원 안 함";return;}
  recognitionAvailable=true;
  recognition=new SR();
  recognition.lang="ko-KR";
  recognition.continuous=true;
  recognition.interimResults=true;
  recognition.maxAlternatives=5;
  recognition.onstart=()=>{listening=true;$("speech").textContent=awake?"이비 대기 중":"휴면";};
  recognition.onresult=e=>{
    let finalText="";
    for(let i=e.resultIndex;i<e.results.length;i++){
      if(e.results[i].isFinal){finalText+=e.results[i][0].transcript;}
    }
    if(!finalText.trim()||speaking)return;
    processSpeech(finalText.trim());
  };
  recognition.onerror=e=>{$("speech").textContent="재연결 중";console.log("speech",e.error);};
  recognition.onend=()=>{listening=false;$("speech").textContent=awake?"이비 대기 중":"휴면"; if(running) restartRecognition(350);};
}
function restartRecognition(ms=200){if(!running||!recognitionAvailable||!recognition)return;clearTimeout(wakeTimer);wakeTimer=setTimeout(()=>{if(!listening){try{recognition.start()}catch{}}},ms);}
function stopRecognition(){if(!recognition)return;try{recognition.stop()}catch{}}

function processSpeech(text){
  const wake=findWake(text);
  if(!awake){
    // 휴면 상태에서는 음성을 포함한 모든 말을 무시한다.
    return;
  }
  if(!wake) return; // 반드시 "이비"가 있어야 다음 내용을 처리한다.
  const command=removeWake(text);
  log("YOU: "+text);
  if(!command){say("네, 말씀하세요.");return;}
  handleCommand(command);
}

async function handleCommand(raw){
  const t=normalize(raw);
  if(/^(쉬어|쉬어줘|휴면|휴면해|잠자|자러가|그만할게|대기해)$/.test(t)||t.includes("휴면 상태로 들어가")){sleep();return;}
  if(t.includes("시간")||t.includes("몇 시")||t.includes("시계")){
    try{const r=await fetch('/api/time');const d=await r.json();say('현재 시간은 '+d.text+'입니다.');log('TIME: '+d.text);}catch{say('시간 정보를 가져오지 못했어요.');}return;
  }
  if(t.includes("날씨")||t.includes("기온")||t.includes("비 와")||t.includes("비가 와")){
    const city=extractCity(t)||"서울";
    try{const r=await fetch('/api/weather?city='+encodeURIComponent(city));const d=await r.json();if(!r.ok)throw 0;const msg=`${d.city}의 현재 날씨는 ${d.condition}이고, 기온은 ${d.temperature}도, 체감온도는 ${d.feelsLike}도예요.`;say(msg);log('WEATHER: '+msg);}catch{say('날씨 정보를 가져오지 못했어요.');}return;
  }
  if(t.includes("검색")||t.includes("찾아봐")||t.includes("찾아줘")||t.includes("검색해줘")){
    let q=t.replace(/검색해줘|검색해|검색|찾아봐줘|찾아봐|찾아줘|찾아/g,'').trim();
    if(!q){say('무엇을 찾아볼까요?');return;}
    const r=await fetch('/api/search?q='+encodeURIComponent(q));const d=await r.json();window.open(d.url,'_blank');say(q+' 검색 결과를 열었어요.');log('SEARCH: '+q);return;
  }
  if(t.includes("안녕")||t.includes("반가워")){say('안녕하세요. 무엇을 도와드릴까요?');return;}
  if(t.includes("누구")&&t.includes("너")){say('저는 이비예요. 음성으로 대화하고 여러 가지 간단한 작업을 도와드릴 수 있어요.');return;}
  if(t.includes("고마워")||t.includes("감사")){say('천만에요.');return;}
  if(t.includes("이름")&&t.includes("뭐")){say('제 이름은 이비예요.');return;}
  if(t.includes("잘 지내")||t.includes("어때")){say('정상 작동 중이에요. 언제든 말씀하세요.');return;}
  if(t.includes("유튜브")){window.open('https://www.youtube.com','_blank');say('유튜브를 열었어요.');return;}
  if(t.includes("구글")){window.open('https://www.google.com','_blank');say('구글을 열었어요.');return;}
  if(t.includes("네이버")){window.open('https://www.naver.com','_blank');say('네이버를 열었어요.');return;}
  if(t.includes("계산")){
    const expr=t.replace(/계산해줘|계산해|계산|해줘/g,'').replace(/더하기/g,'+').replace(/빼기/g,'-').replace(/곱하기/g,'*').replace(/나누기/g,'/').replace(/[^0-9+\-*/().]/g,'');
    if(expr){try{const result=Function('"use strict";return ('+expr+')')();say('계산 결과는 '+result+'입니다.');return}catch{}}
  }
  say(`말씀하신 내용은 "${raw}"이에요. 현재 시간, 날씨, 검색, 계산, 사이트 열기, 일반 대화와 휴면 명령을 처리할 수 있어요.`);
}
function extractCity(t){const a=["서울","부산","인천","대구","대전","광주","울산","수원","용인","성남","제주","강릉","전주","청주","평택","화성","천안"] ;return a.find(x=>t.includes(x))||'';}

async function startMic(){
  if(running)return;
  try{
    micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true,channelCount:1}});
    audioContext=new (window.AudioContext||window.webkitAudioContext)();
    analyser=audioContext.createAnalyser(); analyser.fftSize=2048;
    const source=audioContext.createMediaStreamSource(micStream);source.connect(analyser);
    running=true;$("mic").textContent="정상";$("startBtn").classList.add('active');$("startBtn").textContent='마이크 ON';
    say('마이크가 준비됐어요. 휴면 상태에서는 아무 말에도 반응하지 않아요. 깨우려면 이비라고 말해주세요.');
    log('마이크 연결 완료');
    restartRecognition(400);
  }catch(e){console.error(e);$("mic").textContent='권한 필요';say('마이크 권한을 허용해주세요.');}
}
function activate(){if(!running)return;setMode(true);say('네, 듣고 있어요. 무엇을 도와드릴까요?');log('WAKE: 이비');restartRecognition(500);}
function sleep(){setMode(false);say('휴면 상태에 들어갈게요.');log('SLEEP');stopRecognition();restartRecognition(800);}

$("startBtn").onclick=startMic;
$("sleepBtn").onclick=()=>{if(!running)startMic();else sleep();};
$("testBtn").onclick=()=>say(awake?'음성 인식 테스트가 정상 작동 중이에요.':'현재 휴면 상태예요.');
$("send").onclick=()=>{const v=$("manual").value.trim();if(!v)return;$("manual").value='';if(!awake){say('현재 휴면 상태예요.');return}handleCommand(v)};
$("manual").addEventListener('keydown',e=>{if(e.key==='Enter')$("send").click()});
setMode(false);setupRecognition();
</script>
</body></html>
