<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이비</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #020817;
  color: #e5f2ff;
  font-family: Arial, sans-serif;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.container {
  width: min(900px, 94vw);
  background: #071426;
  border: 1px solid #16385c;
  border-radius: 24px;
  padding: 30px;
  box-shadow: 0 0 50px rgba(0, 120, 255, .15);
}

h1 {
  margin-top: 0;
  font-size: 42px;
  color: #58b7ff;
}

.status {
  padding: 18px;
  background: #020b18;
  border-radius: 14px;
  margin: 20px 0;
  font-size: 20px;
}

.result {
  min-height: 100px;
  padding: 20px;
  background: #020b18;
  border-radius: 14px;
  margin-bottom: 20px;
  line-height: 1.7;
}

button {
  border: 0;
  border-radius: 12px;
  padding: 15px 20px;
  margin: 5px;
  font-size: 17px;
  cursor: pointer;
  background: #1683ff;
  color: white;
}

button:hover {
  background: #3195ff;
}

button.stop {
  background: #a52b3a;
}

.log {
  margin-top: 20px;
  background: #01060d;
  border-radius: 12px;
  padding: 15px;
  height: 180px;
  overflow-y: auto;
  font-family: monospace;
  font-size: 13px;
  color: #8eb1ce;
}

.green {
  color: #61ff9b;
}

.red {
  color: #ff6575;
}

.blue {
  color: #62baff;
}
</style>
</head>

<body>

<div class="container">

  <h1>🤖 이비</h1>

  <div class="status" id="status">
    🔴 마이크 대기 중
  </div>

  <div class="result">

    <div>
      <b>내 말:</b>
      <span id="heard">아직 없음</span>
    </div>

    <br>

    <div>
      <b>이비:</b>
      <span id="answer">마이크를 시작해주세요.</span>
    </div>

  </div>

  <button onclick="startAssistant()">
    🎤 마이크 시작
  </button>

  <button onclick="testVoice()">
    🔊 음성 테스트
  </button>

  <button class="stop" onclick="stopAssistant()">
    ⏹ 정지
  </button>

  <div class="log" id="log"></div>

</div>

<script>

let recognition = null;
let running = false;
let speaking = false;


/* =========================
   로그
========================= */

function log(text, type = "") {

  const box = document.getElementById("log");

  const line = document.createElement("div");

  if (type) {
    line.className = type;
  }

  line.textContent =
    "[" +
    new Date().toLocaleTimeString() +
    "] " +
    text;

  box.appendChild(line);

  box.scrollTop = box.scrollHeight;

  console.log(text);
}


/* =========================
   상태
========================= */

function setStatus(text) {

  document.getElementById("status").textContent = text;

}


/* =========================
   음성 출력
========================= */

function speak(text) {

  if (!text) return;

  speaking = true;

  document.getElementById("answer").textContent = text;

  log("이비: " + text, "green");

  try {

    speechSynthesis.cancel();

    const utter =
      new SpeechSynthesisUtterance(text);

    utter.lang = "ko-KR";

    utter.rate = 0.95;

    utter.pitch = 0.9;

    utter.volume = 1;

    utter.onend = () => {

      speaking = false;

      if (running) {
        restartRecognition();
      }

    };

    utter.onerror = () => {

      speaking = false;

      if (running) {
        restartRecognition();
      }

    };

    speechSynthesis.speak(utter);

  } catch (e) {

    speaking = false;

    log(
      "음성 출력 오류: " + e.message,
      "red"
    );

  }

}


/* =========================
   마이크 시작
========================= */

async function startAssistant() {

  if (running) {

    log("이미 실행 중입니다.");

    return;

  }

  log("마이크 연결을 시도합니다...");

  setStatus("🟡 마이크 연결 중...");

  try {

    const stream =
      await navigator.mediaDevices.getUserMedia({
        audio: true
      });

    log("마이크 연결 성공!", "green");

    // 마이크 스트림 유지
    window.microphoneStream = stream;

  } catch (error) {

    console.error(error);

    setStatus("🔴 마이크 연결 실패");

    if (error.name === "NotAllowedError") {

      log(
        "마이크 권한이 거부되었습니다. Chrome 주소창의 🔒 → 마이크 → 허용으로 바꿔주세요.",
        "red"
      );

    } else if (error.name === "NotFoundError") {

      log(
        "연결된 마이크를 찾을 수 없습니다.",
        "red"
      );

    } else if (error.name === "NotReadableError") {

      log(
        "마이크가 다른 프로그램에서 사용 중입니다.",
        "red"
      );

    } else {

      log(
        "마이크 오류: " +
        error.name +
        " / " +
        error.message,
        "red"
      );

    }

    return;

  }


  if (
    !("SpeechRecognition" in window) &&
    !("webkitSpeechRecognition" in window)
  ) {

    setStatus("🔴 음성 인식 미지원");

    log(
      "이 브라우저는 음성 인식을 지원하지 않습니다. Chrome을 사용해주세요.",
      "red"
    );

    return;

  }


  running = true;

  setStatus("🟢 이비가 듣고 있습니다.");

  document.getElementById("answer").textContent =
    "네. 듣고 있습니다.";

  speak("안녕하세요. 오늘은 무엇을 도와드릴까요?");

  createRecognition();

}


/* =========================
   음성 인식 생성
========================= */

function createRecognition() {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  recognition = new SpeechRecognition();

  recognition.lang = "ko-KR";

  recognition.continuous = true;

  recognition.interimResults = true;

  recognition.maxAlternatives = 5;


  recognition.onstart = () => {

    log("음성 인식 시작", "blue");

    setStatus("🟢 이비가 듣고 있습니다.");

  };


  recognition.onresult = (event) => {

    let finalText = "";

    let interimText = "";


    for (
      let i = event.resultIndex;
      i < event.results.length;
      i++
    ) {

      const text =
        event.results[i][0].transcript;

      if (event.results[i].isFinal) {

        finalText += text;

      } else {

        interimText += text;

      }

    }


    const display =
      finalText || interimText;

    if (display) {

      document.getElementById("heard").textContent =
        display;

    }


    if (finalText.trim()) {

      log(
        "인식됨: " + finalText,
        "blue"
      );

      processCommand(finalText.trim());

    }

  };


  recognition.onerror = (event) => {

    log(
      "음성 인식 오류: " +
      event.error,
      "red"
    );

    if (event.error === "not-allowed") {

      running = false;

      setStatus("🔴 마이크 권한이 필요합니다.");

      return;

    }

    if (event.error === "service-not-allowed") {

      running = false;

      setStatus("🔴 음성 인식 서비스가 차단되었습니다.");

      return;

    }

  };


  recognition.onend = () => {

    log("음성 인식 종료");

    if (running && !speaking) {

      setTimeout(() => {

        restartRecognition();

      }, 300);

    }

  };


  try {

    recognition.start();

  } catch (e) {

    log(
      "음성 인식 시작 오류: " +
      e.message,
      "red"
    );

  }

}


/* =========================
   음성 인식 재시작
========================= */

function restartRecognition() {

  if (!running) return;

  if (speaking) return;

  if (!recognition) {

    createRecognition();

    return;

  }

  try {

    recognition.start();

  } catch (e) {

    setTimeout(() => {

      if (running && !speaking) {

        try {

          recognition.start();

        } catch {}

      }

    }, 500);

  }

}


/* =========================
   명령 처리
========================= */

async function processCommand(command) {

  const text =
    command
      .toLowerCase()
      .replace(/[.,!?]/g, "")
      .trim();


  /* 쉬기 */

  if (
    text.includes("쉬어") ||
    text.includes("휴식") ||
    text.includes("잠자")
  ) {

    speak("휴면 상태에 돌입합니다.");

    return;

  }


  /* 안녕 */

  if (
    text.includes("안녕") ||
    text.includes("하이") ||
    text.includes("헬로")
  ) {

    speak("안녕하세요.");

    return;

  }


  /* 이름 */

  if (
    text.includes("이름") &&
    (
      text.includes("뭐") ||
      text.includes("무엇")
    )
  ) {

    speak("제 이름은 이비입니다.");

    return;

  }


  /* 시간 */

  if (
    text.includes("몇 시") ||
    text.includes("시간")
  ) {

    const now = new Date();

    const hour =
      now.getHours();

    const minute =
      now.getMinutes();

    speak(
      "현재 시간은 " +
      hour +
      "시 " +
      minute +
      "분입니다."
    );

    return;

  }


  /* 날짜 */

  if (
    text.includes("오늘") &&
    (
      text.includes("날짜") ||
      text.includes("며칠")
    )
  ) {

    const now = new Date();

    const year =
      now.getFullYear();

    const month =
      now.getMonth() + 1;

    const day =
      now.getDate();

    speak(
      "오늘은 " +
      year +
      "년 " +
      month +
      "월 " +
      day +
      "일입니다."
    );

    return;

  }


  /* 날씨 */

  if (
    text.includes("날씨") ||
    text.includes("기온") ||
    text.includes("비 와")
  ) {

    await getWeather(text);

    return;

  }


  /* 유튜브 */

  if (
    text.includes("유튜브")
  ) {

    speak("유튜브를 열겠습니다.");

    setTimeout(() => {

      window.open(
        "https://www.youtube.com",
        "_blank"
      );

    }, 700);

    return;

  }


  /* 네이버 */

  if (
    text.includes("네이버")
  ) {

    speak("네이버를 열겠습니다.");

    setTimeout(() => {

      window.open(
        "https://www.naver.com",
        "_blank"
      );

    }, 700);

    return;

  }


  /* 구글 */

  if (
    text.includes("구글")
  ) {

    speak("구글을 열겠습니다.");

    setTimeout(() => {

      window.open(
        "https://www.google.com",
        "_blank"
      );

    }, 700);

    return;

  }


  /* 검색 */

  if (
    text.startsWith("검색") ||
    text.startsWith("찾아") ||
    text.includes("검색해")
  ) {

    let query =
      text
        .replace(/^검색/, "")
        .replace(/^검색해/, "")
        .replace(/^찾아/, "")
        .trim();

    if (!query) {

      speak("무엇을 검색할까요?");

      return;

    }

    speak(
      query +
      "를 검색하겠습니다."
    );

    setTimeout(() => {

      window.open(
        "https://www.google.com/search?q=" +
        encodeURIComponent(query),
        "_blank"
      );

    }, 700);

    return;

  }


  /* 계산 */

  if (
    text.includes("계산") ||
    text.includes("더하기") ||
    text.includes("빼기") ||
    text.includes("곱하기")
  ) {

    speak("계산 기능은 다음 단계에서 연결할 수 있습니다.");

    return;

  }


  /* 감사 */

  if (
    text.includes("고마워") ||
    text.includes("감사")
  ) {

    speak("천만에요.");

    return;

  }


  /* 도움 */

  if (
    text.includes("뭐 할 수 있어") ||
    text.includes("무엇을 할 수 있어") ||
    text.includes("도와줄 수 있어")
  ) {

    speak(
      "시간, 날짜, 날씨 확인과 웹사이트 열기, 검색 등을 할 수 있습니다."
    );

    return;

  }


  /* 일반 응답 */

  speak(
    "말씀하신 내용을 들었습니다. 아직 그 명령에는 연결되지 않았지만 음성 인식은 정상적으로 작동하고 있습니다."
  );

}


/* =========================
   날씨
========================= */

async function getWeather(text) {

  try {

    let city = "서울";

    if (text.includes("수원")) {
      city = "수원";
    }

    if (text.includes("용인")) {
      city = "용인";
    }

    if (text.includes("서울")) {
      city = "서울";
    }

    speak(
      city +
      "의 날씨를 확인하겠습니다."
    );


    const response =
      await fetch(
        "/api/weather?city=" +
        encodeURIComponent(city)
      );


    if (!response.ok) {

      throw new Error(
        "날씨 API 오류"
      );

    }


    const data =
      await response.json();


    const temp =
      data.current.temperature_2m;


    const feels =
      data.current.apparent_temperature;


    speak(
      city +
      "의 현재 기온은 " +
      temp +
      "도이고, 체감온도는 " +
      feels +
      "도입니다."
    );


  } catch (e) {

    log(
      "날씨 오류: " +
      e.message,
      "red"
    );

    speak(
      "날씨 정보를 가져오지 못했습니다."
    );

  }

}


/* =========================
   음성 테스트
========================= */

function testVoice() {

  speak(
    "안녕하세요. 저는 이비입니다. 음성 출력 테스트입니다."
  );

}


/* =========================
   정지
========================= */

function stopAssistant() {

  running = false;

  speaking = false;

  if (recognition) {

    try {
      recognition.stop();
    } catch {}

  }

  if (window.microphoneStream) {

    window.microphoneStream
      .getTracks()
      .forEach(track => track.stop());

  }

  speechSynthesis.cancel();

  setStatus("🔴 이비 정지");

  log(
    "이비가 정지되었습니다."
  );

}


/* =========================
   시작 로그
========================= */

window.addEventListener(
  "load",
  () => {

    log(
      "이비 시스템 준비 완료."
    );

    log(
      "🎤 마이크 시작 버튼을 눌러주세요."
    );

  }
);

</script>

</body>
</html>
