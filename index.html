/* =========================================================
   SPEAKING
========================================================= */

async function speak(text) {
  if (!text) return;

  speaking = true;

  try {
    console.log("E.B. 응답:", text);

    // 서버 TTS 시도
    try {
      const response = await fetch("/api/tts", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          text: text
        })
      });

      if (response.ok) {
        const data = await response.json();

        if (data.audio) {
          if (currentAudio) {
            currentAudio.pause();
            currentAudio = null;
          }

          currentAudio = new Audio(data.audio);

          await new Promise((resolve) => {
            currentAudio.onended = resolve;
            currentAudio.onerror = resolve;

            currentAudio.play().catch(() => {
              resolve();
            });
          });

          return;
        }
      }
    } catch (error) {
      console.warn("서버 TTS 실패:", error);
    }

    // 서버 TTS가 실패하면 브라우저 음성으로 대체
    if ("speechSynthesis" in window) {
      window.speechSynthesis.cancel();

      await new Promise((resolve) => {
        const utterance = new SpeechSynthesisUtterance(text);

        utterance.lang = "ko-KR";
        utterance.rate = 1.0;
        utterance.pitch = 0.9;
        utterance.volume = 1.0;

        utterance.onend = resolve;
        utterance.onerror = resolve;

        window.speechSynthesis.speak(utterance);

        // 혹시 onend가 안 오는 경우
        setTimeout(resolve, 10000);
      });
    }
  } finally {
    speaking = false;
  }
}

>
시작

<script src="https://www.youtube.com/iframe_api"></script>

<script>
/* =========================================================
   E.B. CORE
   모든 JavaScript는 이 하나의 script 안에서 관리
========================================================= */

(() => {

  "use strict";


  /* =======================================================
     1. 상태
  ======================================================= */

  let running = false;
  let awake = false;
  let speaking = false;
  let processing = false;

  let recognition = null;
  let recognitionStarting = false;
  let restartTimer = null;

  let microphoneStream = null;
  let audioContext = null;
  let analyser = null;
  let microphoneSource = null;

  let clapCount = 0;
  let clapResetTimer = null;

  let currentAudio = null;


  /* =======================================================
     2. 대화 기억
  ======================================================= */

  const defaultMemory = {
    lastUserText: "",
    lastAssistantText: "",
    lastAction: "",
    lastWebsite: "",
    lastCity: "",
    lastSearch: "",
    lastTopic: "",
    history: []
  };

  let conversationMemory = {
    ...defaultMemory
  };

  const MEMORY_KEY =
    "EB_CONVERSATION_MEMORY";


  function loadMemory() {

    try {

      const saved =
        localStorage.getItem(
          MEMORY_KEY
        );

      if (saved) {

        conversationMemory = {
          ...defaultMemory,
          ...JSON.parse(saved)
        };

      }

    } catch (error) {

      console.error(
        "Memory load error:",
        error
      );

      conversationMemory = {
        ...defaultMemory
      };

    }

  }


  function saveMemory() {

    try {

      localStorage.setItem(
        MEMORY_KEY,
        JSON.stringify(
          conversationMemory
        )
      );

    } catch (error) {

      console.error(
        "Memory save error:",
        error
      );

    }

  }


  function rememberUser(text) {

    conversationMemory.lastUserText =
      text;

    conversationMemory.history.push({
      role: "user",
      text,
      time: Date.now()
    });

    if (
      conversationMemory.history.length > 12
    ) {

      conversationMemory.history =
        conversationMemory.history.slice(-12);

    }

    saveMemory();

  }


  function rememberAssistant(text) {

    conversationMemory.lastAssistantText =
      text;

    conversationMemory.history.push({
      role: "assistant",
      text,
      time: Date.now()
    });

    if (
      conversationMemory.history.length > 12
    ) {

      conversationMemory.history =
        conversationMemory.history.slice(-12);

    }

    saveMemory();

  }


  function rememberAction(
    action,
    data = {}
  ) {

    conversationMemory.lastAction =
      action;

    if (data.website) {

      conversationMemory.lastWebsite =
        data.website;

    }

    if (data.city) {

      conversationMemory.lastCity =
        data.city;

    }

    if (data.search) {

      conversationMemory.lastSearch =
        data.search;

    }

    saveMemory();

  }


  /* =======================================================
     3. 기본 음성 출력
  ======================================================= */

  async function speak(text) {

    if (!text) {
      return;
    }

    speaking = true;

    rememberAssistant(text);

    try {

      const response =
        await fetch(
          "/api/tts",
          {
            method: "POST",
            headers: {
              "Content-Type":
                "application/json"
            },
            body: JSON.stringify({
              text
            })
          }
        );

      if (!response.ok) {
        throw new Error(
          `TTS HTTP ${response.status}`
        );
      }

      const blob =
        await response.blob();

      const url =
        URL.createObjectURL(blob);

      if (currentAudio) {

        try {
          currentAudio.pause();
        } catch (_) {}

      }

      currentAudio =
        new Audio(url);

      currentAudio.volume = 1;

      await new Promise(
        resolve => {

          currentAudio.onended =
            resolve;

          currentAudio.onerror =
            resolve;

          currentAudio.play()
            .catch(resolve);

        }
      );

      URL.revokeObjectURL(url);

    } catch (error) {

      console.warn(
        "Server TTS failed:",
        error
      );

      if (
        "speechSynthesis" in window
      ) {

        await new Promise(
          resolve => {

            const utterance =
              new SpeechSynthesisUtterance(
                text
              );

            utterance.lang = "ko-KR";
            utterance.rate = 0.88;
            utterance.pitch = 0.82;
            utterance.volume = 1;

            utterance.onend =
              resolve;

            utterance.onerror =
              resolve;

            speechSynthesis.cancel();

            speechSynthesis.speak(
              utterance
            );

          }
        );

      }

    }

    speaking = false;

  }


  async function respond(text) {

    await speak(text);

  }


  /* =======================================================
     4. YouTube 상태
  ======================================================= */

  let youtubePlayer = null;
  let youtubeReady = false;

  let youtubeResults = [];
  let youtubeCurrentIndex = -1;
  let youtubeCurrentQuery = "";


  /* =======================================================
     5. YouTube API 준비
  ======================================================= */

  window.onYouTubeIframeAPIReady =
    function () {

      if (
        typeof YT === "undefined" ||

  /* =======================================================
     7. YouTube 검색
  ======================================================= */

  async function searchYouTube(
    query,
    autoPlayFirst = false
  ) {

    try {

      const cleanQuery =
        String(query || "")
          .trim();

      if (!cleanQuery) {

        await respond(
          "검색어를 말씀해주세요."
        );

        return;

      }

      youtubeCurrentQuery =
        cleanQuery;

      rememberAction(
        "youtube-search",
        {
          search: cleanQuery,
          website: "youtube"
        }
      );

      openYouTubePanel();

      await respond(
        `유튜브에서 ${cleanQuery}를 검색하겠습니다.`
      );

      const response =
        await fetch(
          "/api/youtube/search?q=" +
          encodeURIComponent(
            cleanQuery
          )
        );

      const data =
        await response.json();

      if (!response.ok) {

        throw new Error(
          data.error ||
          `HTTP ${response.status}`
        );

      }

      youtubeResults =
        Array.isArray(data.videos)
          ? data.videos
          : [];

      youtubeCurrentIndex = -1;

      console.log(
        "YOUTUBE RESULTS:",
        youtubeResults
      );

      renderYouTubeResults();

      if (
        youtubeResults.length === 0
      ) {

        await respond(
          "검색 결과를 찾지 못했습니다."
        );

        return;

      }

      if (autoPlayFirst) {

        await playYouTubeResult(0);

      } else {

        await respond(
          `검색 결과 ${youtubeResults.length}개를 찾았습니다. 원하는 영상 번호를 말씀해주세요.`
        );

      }

    } catch (error) {

      console.error(
        "YouTube 검색 오류:",
        error
      );

      await respond(
        "유튜브 검색 중 오류가 발생했습니다."
      );

    }

  }


  /* =======================================================
     8. YouTube 결과 표시
  ======================================================= */

  function escapeHtml(value) {

    return String(value || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  function renderYouTubeResults() {

    const container =
      document.getElementById(
        "youtubeResults"
      );

    if (!container) {
      return;
    }

    container.innerHTML = "";

    youtubeResults.forEach(
      (video, index) => {

        const item =
          document.createElement(
            "div"
          );

        item.className =
          "youtubeResult";

        item.innerHTML = `
          <img
            src="${escapeHtml(video.thumbnail)}"
            alt=""
          >

          <div>
            <div class="youtubeResultTitle">
              ${index + 1}. ${escapeHtml(video.title)}
            </div>

            <div class="youtubeResultChannel">
              ${escapeHtml(video.channel)}
            </div>
          </div>
        `;

        item.onclick =
          function () {

            playYouTubeResult(
              index
            );

          };

        container.appendChild(
          item
        );

      }
    );

  }

  async function playYouTubeResult(
    index
  ) {

    if (
      !youtubeResults ||
      !youtubeResults[index]
    ) {

      await respond(
        "해당 영상을 찾을 수 없습니다."
      );

      return;

    }

    if (
      !youtubeReady ||
      !youtubePlayer
    ) {

      await respond(
        "유튜브 플레이어가 아직 준비되지 않았습니다."
      );

      return;

    }

    const video =
      youtubeResults[index];

    youtubeCurrentIndex =
      index;

    youtubePlayer.loadVideoById({
      videoId: video.videoId,
      startSeconds: 0
    });

    rememberAction(
      "youtube-play",
      {
        search:
          youtubeCurrentQuery,
        website:
          "youtube"
      }
    );

    console.log(
      "YOUTUBE PLAY:",

  /* =======================================================
     10. YouTube 재생 제어
  ======================================================= */

  function youtubePlay() {

    if (
      youtubePlayer &&
      youtubeReady
    ) {

      youtubePlayer.playVideo();

    }

  }


  function youtubePause() {

    if (
      youtubePlayer &&
      youtubeReady
    ) {

      youtubePlayer.pauseVideo();

    }

  }


  function youtubeStop() {

    if (
      youtubePlayer &&
      youtubeReady
    ) {

      youtubePlayer.stopVideo();

    }

  }


  function youtubeVolumeUp() {

    if (
      !youtubePlayer ||
      !youtubeReady
    ) {
      return;
    }

    const volume =
      youtubePlayer.getVolume();

    youtubePlayer.setVolume(
      Math.min(
        100,
        volume + 10
      )
    );

  }


  function youtubeVolumeDown() {

    if (
      !youtubePlayer ||
      !youtubeReady
    ) {
      return;
    }

    const volume =
      youtubePlayer.getVolume();

    youtubePlayer.setVolume(
      Math.max(
        0,
        volume - 10
      )
    );

  }


  function youtubeMute() {

    if (
      youtubePlayer &&
      youtubeReady
    ) {

      youtubePlayer.mute();

    }

  }


  function youtubeUnmute() {

    if (
      youtubePlayer &&
      youtubeReady
    ) {

      youtubePlayer.unMute();

    }

  }


  function youtubeNext() {

    if (
      youtubeResults.length === 0
    ) {
      return;
    }

    let nextIndex =
      youtubeCurrentIndex + 1;

    if (
      nextIndex >= youtubeResults.length
    ) {

      nextIndex = 0;

    }

    playYouTubeResult(
      nextIndex
    );

  }


  function youtubePrevious() {

    if (
      youtubeResults.length === 0
    ) {
      return;
    }

    let previousIndex =
      youtubeCurrentIndex - 1;

    if (
      previousIndex < 0
    ) {

      previousIndex =
        youtubeResults.length - 1;

    }

    playYouTubeResult(
      previousIndex
    );

  }


  /* =======================================================
     11. YouTube 음성 명령
  ======================================================= */

  async function processYouTubeCommand(
    text
  ) {

    text =
      String(text || "")
        .trim()
        .replace(/\s+/g, " ");

    console.log(
      "YOUTUBE COMMAND:",
      text
    );


    if (
      !text.includes("유튜브")
    ) {

      return false;

    }


    /* 첫 번째 영상 */

    if (
      /첫\s*번째|첫번째|1번/.test(text) &&
      /영상|비디오|재생|틀어/.test(text)
    ) {

      if (
        youtubeResults.length === 0
      ) {

        await respond(
          "먼저 유튜브에서 영상을 검색해주세요."
        );

        return true;

      }

      await playYouTubeResult(0);

      return true;

    }


    /* 번호 영상 */

    const numberMatch =
      text.match(
        /(\d+)\s*번/
      );

    if (
      numberMatch &&
      /영상|비디오|재생|틀어/.test(text)
    ) {

      const index =
        Number(
          numberMatch[1]
        ) - 1;

      if (
        index < 0 ||
        index >= youtubeResults.length
      ) {

        await respond(
          "해당 번호의 영상이 없습니다."
        );

        return true;

      }

      await playYouTubeResult(
        index
      );

      return true;

    }


    /* 일시정지 */

    if (
      /일시정지|멈춰|pause/i.test(text)
    ) {

      youtubePause();

      return true;

    }


    /* 재생 */

    if (
      /재생|틀어|플레이|다시 재생/.test(text) &&
      !text.includes("검색")
    ) {

      youtubePlay();

      return true;

    }


    /* 정지 */

    if (
      /정지|그만/.test(text)
    ) {

      youtubeStop();

      return true;

    }


    /* 볼륨 증가 */

    if (
      /볼륨.*(올려|높여|키워)/.test(text) ||
      /소리.*(올려|높여|키워)/.test(text)
    ) {

      youtubeVolumeUp();

      return true;

    }


    /* 볼륨 감소 */

    if (
      /볼륨.*(내려|낮춰|줄여)/.test(text) ||
      /소리.*(내려|낮춰|줄여)/.test(text)
    ) {

      youtubeVolumeDown();

      return true;

    }


    /* 음소거 */

    if (
      /음소거|뮤트|소리 꺼/.test(text)
    ) {

      youtubeMute();

      return true;

    }


    /* 음소거 해제 */

    if (
      /음소거 해제|뮤트 해제|소리 켜/.test(text)
    ) {

      youtubeUnmute();

      return true;

    }


    /* 다음 영상 */

    if (
      /다음 영상|다음거|다음 것|다음곡/.test(text)
    ) {

      youtubeNext();

      return true;

    }


    /* 이전 영상 */

    if (
      /이전 영상|이전거|이전 것|이전곡/.test(text)
    ) {

      youtubePrevious();

      return true;

    }


    /* 검색 */

    if (
      text.includes("검색") ||
      text.includes("찾아")
    ) {

      let query =
        text;

      query =
        query
          .replace(
            /유튜브에서/g,
            ""
          )
          .replace(
            /유튜브에/g,
            ""
          )
          .replace(
            /유튜브로/g,
            ""
          )
          .replace(
            /유튜브/g,
            ""
          );

      query =
        query
          .replace(
            /이라고\s*검색해줘/g,
            ""
          )
          .replace(
            /라고\s*검색해줘/g,
            ""
          )
          .replace(
            /이라고\s*검색해/g,
            ""
          )
          .replace(
            /라고\s*검색해/g,
            ""
          );

      query =
        query
          .replace(
            /검색해주세요/g,
            ""
          )
          .replace(
            /검색해줘/g,
            ""
          )
          .replace(
            /검색해/g,
            ""
          )
          .replace(
            /검색/g,
            ""
          );

      query =
        query
          .replace(
            /찾아주세요/g,
            ""
          )
          .replace(
            /찾아줘/g,
            ""
          )
          .replace(
            /찾아/g,
            ""
          );

      query =
        query
          .replace(
            /\s*이라고\s*$/g,
            ""
          )
          .replace(
            /\s*라고\s*$/g,
            ""
          );

      query =
        query
          .replace(
            /["'“”‘’「」『』]/g,
            ""
          )
          .trim();


      if (!query) {

        await respond(
          "유튜브에서 무엇을 검색할까요?"
        );

        return true;

      }


      await searchYouTube(
        query,
        false
      );

      return true;

    }


    return false;

  }

  /* =======================================================
     13. 박수 감지
  ======================================================= */

 function detectClap() {

  if (
    !analyser ||
    !running
  ) {
    return;
  }

  const bufferLength =
    analyser.fftSize;

  const data =
    new Uint8Array(bufferLength);

  analyser.getByteTimeDomainData(data);

  let peak = 0;
  let sum = 0;

  for (
    let i = 0;
    i < data.length;
    i++
  ) {

    const value =
      (data[i] - 128) / 128;

    const abs =
      Math.abs(value);

    peak =
      Math.max(
        peak,
        abs
      );

    sum +=
      value * value;
  }

  const rms =
    Math.sqrt(
      sum / data.length
    );


  /* =========================
     소리 감지 UI
  ========================= */

  const soundDetected =
    document.getElementById(
      "soundDetected"
    );

  if (soundDetected) {

    if (rms > 0.025) {

      soundDetected.classList.add(
        "show"
      );

      soundDetected.textContent =
        "소리가 감지됐습니다";

    } else {

      soundDetected.classList.remove(
        "show"
      );

    }

  }


  /* =========================
     박수 감지
  ========================= */

  if (
    awake
  ) {
    return;
  }


  if (
    peak > 0.12 &&
    rms > 0.008
  ) {

    const now =
      Date.now();

    clapCount++;

    clearTimeout(
      clapResetTimer
    );

    clapResetTimer =
      setTimeout(
        () => {

          clapCount = 0;

        },
        1800
      );


    console.log(
      "박수 감지:",
      clapCount
    );


    if (
      clapCount >= 2
    ) {

      clapCount = 0;

      wakeUp();

    }

  }

}

  function startAudioMonitor() {

    if (!audioContext) {
      return;
    }

    analyser =
      audioContext.createAnalyser();

    analyser.fftSize =
      1024;

    microphoneSource =
      audioContext.createMediaStreamSource(
        microphoneStream
      );

    microphoneSource.connect(
      analyser
    );

    function loop() {

      if (!running) {
        return;
      }

      detectClap();

      requestAnimationFrame(
        loop
      );

    }

    loop();

  }


  /* =======================================================
     15. 음성 인식
  ======================================================= */

  function setupRecognition() {

    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;

    if (!SpeechRecognition) {

      console.error(
        "이 브라우저는 음성 인식을 지원하지 않습니다."
      );

      return;

    }

    recognition =
      new SpeechRecognition();

    recognition.lang =
      "ko-KR";

    recognition.continuous =
      true;

    recognition.interimResults =
      false;


    recognition.onstart =
      function () {

        recognitionStarting =
          false;

      };


    recognition.onend =
      function () {

        recognitionStarting =
          false;

        if (
          running &&
          !recognitionStarting
        ) {

          clearTimeout(
            restartTimer
          );

          restartTimer =
            setTimeout(
              startRecognition,
              300
            );

        }

      };


    recognition.onerror =
      function (event) {

        recognitionStarting =
          false;

        console.warn(
          "Speech recognition:",
          event.error
        );

      };


    recognition.onresult =
      async function (event) {

        const result =
          event.results[
            event.results.length - 1
          ];

        if (!result) {
          return;
        }

        const text =
          result[0].transcript
            .trim();

        if (!text) {
          return;
        }

        console.log(
          "USER:",
          text
        );

        if (
          !awake ||
          speaking ||
          processing
        ) {

          return;

        }

        rememberUser(text);

        processing =
          true;

        try {

          await processCommand(
            text
          );

        } catch (error) {

          console.error(
            "Command error:",
            error
          );

          await respond(
            "명령을 처리하는 중 오류가 발생했습니다."
          );

        }

        processing =
          false;

      };

  }


  function startRecognition() {

    if (
      !recognition ||
      !running ||
      recognitionStarting
    ) {

      return;

    }

    try {

      recognitionStarting =
        true;

      recognition.start();

    } catch (error) {

      recognitionStarting =
        false;

    }

  }


  /* =======================================================
     16. 일반 명령 처리
  ======================================================= */

  async function processCommand(
    rawText
  ) {

    const text =
      String(rawText || "")
        .trim()
        .replace(/\s+/g, " ");


    /* 휴면 */

    if (
      /^(쉬어|휴면|잠자|절전|자)$/.test(text)
    ) {

      await sleepAssistant();

      return;

    }


    /* YouTube */

    const youtubeHandled =
      await processYouTubeCommand(
        text
      );

    if (youtubeHandled) {
      return;
    }


    /* 이름 */

    if (
      /너 이름|이름이 뭐|누구야/.test(text)
    ) {

      await respond(
        "저는 이비입니다."
      );

      return;

    }


    /* 인사 */

    if (
      /안녕|반가워/.test(text)
    ) {

      await respond(
        "안녕하세요."
      );

      return;

    }


    /* 시간 */

    if (
      /몇 시|현재 시간|지금 시간/.test(text)
    ) {

      const response =
        await fetch(
          "/api/time"
        );

      const data =
        await response.json();

      await respond(
        `현재 시간은 ${data.time}입니다.`
      );

      return;

    }


    /* 날짜 */

    if (
      /오늘 날짜|며칠|몇 월 며칠/.test(text)
    ) {

      const now =
        new Date();

      const date =
        now.toLocaleDateString(
          "ko-KR",
          {
            year: "numeric",
            month: "long",
            day: "numeric",
            weekday: "long"
          }
        );

      await respond(
        `오늘은 ${date}입니다.`
      );

      return;

    }


    /* Google */

    if (
      /구글 열어|구글 켜/.test(text)
    ) {

      window.open(
        "https://www.google.com/",
        "_blank"
      );

      await respond(
        "구글을 열겠습니다."
      );

      return;

    }


    /* Naver */

    if (
      /네이버 열어|네이버 켜/.test(text)
    ) {

      window.open(
        "https://www.naver.com/",
        "_blank"
      );

      await respond(
        "네이버를 열겠습니다."
      );

      return;

    }


    /* 일반 검색 */

    if (
      text.startsWith("검색 ") ||
      text.startsWith("검색해 ")
    ) {

      let query =
        text
          .replace(
            /^검색해?\s*/,
            ""
          )
          .trim();

      if (query) {

        window.open(
          "https://www.google.com/search?q=" +
          encodeURIComponent(query),
          "_blank"
        );

        rememberAction(
          "search",
          {
            search: query
          }
        );

        await respond(
          `${query}를 검색하겠습니다.`
        );

      }

      return;

    }


    /* 감사 */

    if (
      /고마워|감사해/.test(text)
    ) {

      await respond(
        "천만에요."
      );

      return;

    }


    /* 이전 대화 */

    if (
      /아까|전에|방금 뭐/.test(text)
    ) {

      if (
        conversationMemory.lastUserText
      ) {

        await respond(
          `방금 말씀하신 내용은 ${conversationMemory.lastUserText}입니다.`
        );

      } else {

        await respond(
          "아직 기억하고 있는 대화가 없습니다."
        );

      }

      return;

    }


    /* 기본 응답 */

    await respond(
      `"${text}"에 대해 말씀하셨군요. 현재 연결된 기능으로 처리할 수 있는 명령인지 확인해볼게요.`
    );

  }


  /* =======================================================
     17. 이비 시작
  ======================================================= */

  async function startAssistant() {

    if (running) {
      return;
    }

    try {

      microphoneStream =
        await navigator.mediaDevices.getUserMedia(
          {
            audio: {
              echoCancellation: false,
              noiseSuppression: false,
              autoGainControl: false
            }
          }
        );


      audioContext =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();


      await audioContext.resume();


      running =
        true;

      awake =
        false;


      loadMemory();

      setupRecognition();

      startAudioMonitor();

      startRecognition();

      console.log(
        "E.B. STARTED"
      );


    } catch (error) {

      console.error(
        "E.B. 시작 오류:",
        error
      );

      alert(
        "마이크 권한을 허용해야 이비를 시작할 수 있습니다."
      );

    }

  }


  /* =======================================================
     18. 전역 함수 연결
  ======================================================= */

  window.startAssistant =
    startAssistant;

  window.wakeUp =
    wakeUp;

  window.sleepAssistant =
    sleepAssistant;

  window.searchYouTube =
    searchYouTube;

  window.playYouTubeResult =
    playYouTubeResult;

  window.youtubePlay =
    youtubePlay;

  window.youtubePause =
    youtubePause;

  window.youtubeStop =
    youtubeStop;

  window.youtubeVolumeUp =
    youtubeVolumeUp;

  window.youtubeVolumeDown =

  window.youtubeMute =
    youtubeMute;

  window.youtubeUnmute =
    youtubeUnmute;

  window.youtubeNext =
    youtubeNext;

  window.youtubePrevious =
    youtubePrevious;

  window.openYouTubePanel =
    openYouTubePanel;

  window.closeYouTube =
    closeYouTube;


  /* =======================================================
     19. 초기화
  ======================================================= */

  loadMemory();

  console.log(
    "E.B. CORE READY"
  );

})();
