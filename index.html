<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JARVIS Voice Assistant</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 35%,#12395b,#071624 35%,#02070c 75%);color:#dff9ff;font-family:Arial,"Noto Sans KR",sans-serif}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.12;background-image:linear-gradient(#61d9ff 1px,transparent 1px),linear-gradient(90deg,#61d9ff 1px,transparent 1px);background-size:50px 50px}.app{width:min(1000px,94vw);margin:auto;padding:28px 0 50px}.top{display:flex;justify-content:space-between;align-items:center}.logo{font-size:25px;font-weight:800;letter-spacing:7px}.status{color:#73e8ff;font-size:13px}.hud{margin-top:28px;display:grid;grid-template-columns:1fr 250px 1fr;gap:18px;align-items:center}.side,.console{border:1px solid #1c6075;background:#06131ddd;box-shadow:0 0 30px #00b7ff18 inset;padding:20px}.side{min-height:190px}.side h3,.label{margin:0 0 14px;color:#6fe9ff;font-size:12px;letter-spacing:2px}.data{font-size:14px;line-height:2;color:#b9d9e3}.core{width:230px;height:230px;margin:auto;border-radius:50%;border:2px solid #59e4ff;position:relative;display:flex;align-items:center;justify-content:center;box-shadow:0 0 18px #36dfff,0 0 60px #00aaff44,inset 0 0 40px #00aaff22}.core:before,.core:after{content:"";position:absolute;border-radius:50%;border:1px solid #3bcff4}.core:before{inset:18px;animation:spin 7s linear infinite}.core:after{inset:42px;border-style:dashed;animation:spin 4s linear infinite reverse}.orb{width:72px;height:72px;border-radius:50%;background:#bdf7ff;box-shadow:0 0 15px #fff,0 0 50px #00d9ff;animation:pulse 1.8s ease-in-out infinite}.controls{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:28px 0}button{border:1px solid #42d9ff;background:#06202d;color:#cfffff;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer}button:hover{background:#0a3547}button.main{border-radius:50%;width:120px;height:120px;font-size:15px;box-shadow:0 0 35px #00d9ff55}button.active{background:#0c4e61;box-shadow:0 0 40px #00d9ff88}.console{min-height:150px}.label{font-size:11px}#message{font-size:21px;line-height:1.5;margin-top:8px}.input{display:flex;gap:10px;margin-top:14px}input{flex:1;background:#06131c;border:1px solid #235a6b;color:#fff;padding:12px;border-radius:8px;outline:0}.list{max-height:140px;overflow:auto;font-size:12px}.item{padding:7px 0;border-bottom:1px solid #123746}.help{margin-top:18px;color:#7399a6;font-size:12px;line-height:1.7}@keyframes pulse{50%{transform:scale(1.13);opacity:.72}}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:760px){.hud{grid-template-columns:1fr}.core{grid-row:1}.side{min-height:130px}}
</style>
</head>
<body>
<div class="app">
<div class="top"><div class="logo">JARVIS</div><div id="status" class="status">대기 중</div></div>
<div class="hud">
<section class="side"><h3>SYSTEM</h3><div class="data">마이크: <span id="mic">확인 중</span><br>음성 인식: <span id="speech">대기</span><br>모드: <span id="mode">SLEEP</span><br>박수 감지: <span id="clap">대기</span></div></section>
<div class="core"><div class="orb"></div></div>
<section class="side"><h3>COMMAND LOG</h3><div id="history" class="list"></div></section>
</div>
<div class="controls"><button id="startBtn" class="main">마이크<br>시작</button><button id="sleepBtn">휴면</button><button id="testBtn">음성 테스트</button></div>
<div class="console"><div class="label">JARVIS OUTPUT</div><div id="message">마이크 시작을 누르면 준비합니다.</div><div class="input"><input id="manual" placeholder="마이크가 안 될 때 직접 명령 입력"><button id="send">실행</button></div></div>
<div class="help">마이크를 시작한 뒤 <b>👏 박수를 빠르게 2번</b> 치세요. 활성화되면 음성 명령을 받습니다.<br>예: "현재 시간", "서울 날씨", "마인크래프트 검색해줘", "쉬어"</div>
</div>
<script>
const $=id=>document.getElementById(id);let audioContext,analyser,micStream,running=false,awake=false,listening=false,clapCount=0,clapTimer=0,clapLastPeak=0,clapArmed=true,noiseFloor=.015,recognition=null,recognitionAvailable=false,history=[];
function say(t){$("message").textContent=t;if("speechSynthesis"in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="ko-KR";u.rate=.95;u.pitch=.9;speechSynthesis.speak(u)}}
function log(t){history.unshift(t);history=history.slice(0,12);$("history").innerHTML=history.map(x=>`<div class="item">${esc(x)}</div>`).join("")}
function esc(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
function mode(v){awake=v;$("mode").textContent=v?"ACTIVE":"SLEEP";$("status").textContent=v?"JARVIS 활성화":"휴면 상태"}
function activate(){if(!running)return;mode(true);say("안녕하세요. 오늘은 무엇을 도와드릴까요?");log("👏👏 JARVIS 활성화");startRecognition()}
function sleep(){mode(false);stopRecognition();say("휴면 상태에 돌입합니다.");log("휴면 상태 진입")}
function clap(){const now=Date.now();if(now-clapTimer>1200)clapCount=0;clapCount++;clapTimer=now;$("clap").textContent=clapCount+"/2";if(clapCount>=2){clapCount=0;$("clap").textContent="감지 완료";if(!awake)activate()}}
async function startMic(){if(running)return;try{micStream=await navigator.mediaDevices.getUserMedia({audio:true});audioContext=new(window.AudioContext||window.webkitAudioContext)();analyser=audioContext.createAnalyser();analyser.fftSize=1024;audioContext.createMediaStreamSource(micStream).connect(analyser);running=true;$("mic").textContent="정상";$("startBtn").classList.add("active");$("startBtn").textContent="마이크 ON";say("마이크가 준비되었습니다. 박수를 두 번 쳐주세요.");log("마이크 연결 완료");detectClap()}catch(e){console.error(e);$("mic").textContent="권한 필요";say("마이크 권한을 허용해주세요.")}}
function detectClap(){if(!running)return;const data=new Uint8Array(analyser.fftSize);analyser.getByteTimeDomainData(data);let sum=0,peak=0;for(const v of data){const n=Math.abs((v-128)/128);sum+=n*n;if(n>peak)peak=n}const rms=Math.sqrt(sum/data.length),now=Date.now();if(rms<.12)noiseFloor=noiseFloor*.96+rms*.04;const sudden=rms>Math.max(.13,noiseFloor*4.5)&&peak>.45;const cooldown=now-clapLastPeak>180;if(sudden&&cooldown&&clapArmed){clapLastPeak=now;clapArmed=false;clap();setTimeout(()=>clapArmed=true,180)}if(clapCount===1&&now-clapTimer>1200){clapCount=0;$("clap").textContent="대기"}requestAnimationFrame(detectClap)}
function setupRecognition(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$("speech").textContent="지원 안 함";return}recognitionAvailable=true;recognition=new SR();recognition.lang="ko-KR";recognition.continuous=true;recognition.interimResults=false;recognition.maxAlternatives=1;recognition.onstart=()=>{listening=true;$("speech").textContent="듣는 중"};recognition.onresult=e=>{const r=e.results[e.results.length-1];if(!r.isFinal||!awake)return;const t=r[0].transcript.trim();if(t){log("YOU: "+t);handleCommand(t)}};recognition.onerror=e=>{$("speech").textContent="재연결";console.log(e.error)};recognition.onend=()=>{listening=false;$("speech").textContent="대기";if(awake&&running)setTimeout(startRecognition,300)}}
function startRecognition(){if(!recognitionAvailable||!recognition||!running||!awake||listening)return;try{recognition.start()}catch{}}
function stopRecognition(){try{recognition?.stop()}catch{}}
function city(t){return ["서울","부산","인천","대구","대전","광주","울산","수원","용인","성남","제주","강릉","전주","청주"].find(x=>t.includes(x))||""}
async function handleCommand(raw){const t=raw.toLowerCase().replace(/\s+/g," ").trim();if(t.includes("쉬어")||t.includes("휴면")||t.includes("잠자")){sleep();return}if(t.includes("시간")){try{const d=await(await fetch("/api/time")).json();say("현재 시간은 "+d.text+"입니다.");log("TIME: "+d.text)}catch{say("시간 정보를 가져오지 못했습니다.")}return}if(t.includes("날씨")||t.includes("기온")){const c=city(t)||"서울";try{const r=await fetch("/api/weather?city="+encodeURIComponent(c));const d=await r.json();if(!r.ok)throw 0;const s=`${d.city}의 현재 날씨는 ${d.condition}, 기온은 ${d.temperature}도, 체감온도는 ${d.feelsLike}도입니다.`;say(s);log("WEATHER: "+s)}catch{say("날씨 정보를 가져오지 못했습니다.")}return}if(t.includes("검색")){const q=t.replace(/검색해줘|검색해|검색|찾아줘|찾아/g,"").trim();if(!q){say("무엇을 검색할까요?");return}const d=await(await fetch("/api/search?q="+encodeURIComponent(q))).json();window.open(d.url,"_blank");say(`"${q}" 검색 결과를 열었습니다.`);log("SEARCH: "+q);return}if(t.includes("안녕")||t.includes("자비스")){say("네. 말씀하세요.");return}say(`"${raw}" 명령을 이해했습니다. 현재 지원하는 명령은 시간, 날씨, 검색, 쉬어입니다.`);log("UNKNOWN: "+raw)}
$("startBtn").onclick=startMic;$("sleepBtn").onclick=()=>{if(!running)startMic();else awake?sleep():activate()};$("testBtn").onclick=()=>{if(!running)say("먼저 마이크 시작 버튼을 눌러주세요.");else if(!awake)say("현재 휴면 상태입니다. 박수를 두 번 쳐서 깨워주세요.");else say("음성 테스트가 정상적으로 작동하고 있습니다.")};$("send").onclick=()=>{const v=$("manual").value.trim();if(!v)return;if(!awake){say("현재 휴면 상태입니다. 박수를 두 번 쳐주세요.");return}$("manual").value="";log("MANUAL: "+v);handleCommand(v)};$("manual").addEventListener("keydown",e=>{if(e.key==="Enter")$("send").click()});setupRecognition();
</script>
</body></html>
