<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>이비 음성 비서</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  min-height:100%;
}

body{
  color:#e3fbff;
  font-family:Arial,"Noto Sans KR",sans-serif;
  background:
    radial-gradient(
      circle at 50% 35%,
      #123f5d 0%,
      #071725 35%,
      #02070c 80%
    );
  overflow-x:hidden;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.10;

  background-image:
    linear-gradient(#55ddff 1px,transparent 1px),
    linear-gradient(90deg,#55ddff 1px,transparent 1px);

  background-size:50px 50px;
}

.app{
  width:min(1050px,94vw);
  margin:auto;
  padding:28px 0 60px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:31px;
  font-weight:900;
  letter-spacing:8px;
  color:#baf8ff;

  text-shadow:
    0 0 10px #00d9ff,
    0 0 30px #00aaff;
}

.status{
  color:#71eaff;
  font-size:14px;
}

.hud{
  margin-top:30px;

  display:grid;
  grid-template-columns:
    1fr
    260px
    1fr;

  gap:18px;

  align-items:center;
}

.panel{
  min-height:190px;

  padding:20px;

  border:1px solid #1e6278;

  background:rgba(3,15,24,.88);

  box-shadow:
    inset 0 0 30px rgba(0,190,255,.08),
    0 0 20px rgba(0,190,255,.08);
}

.panel h3{
  margin:0 0 15px;

  color:#6eeaff;

  font-size:12px;

  letter-spacing:3px;
}

.info{
  color:#b9dce7;

  font-size:14px;

  line-height:2;
}

.core{
  width:240px;
  height:240px;

  margin:auto;

  border-radius:50%;

  border:2px solid #5ce6ff;

  position:relative;

  display:flex;
  align-items:center;
  justify-content:center;

  box-shadow:
    0 0 20px #20dfff,
    0 0 70px rgba(0,190,255,.28),
    inset 0 0 50px rgba(0,190,255,.18);
}

.core::before{
  content:"";

  position:absolute;

  inset:18px;

  border-radius:50%;

  border:1px solid #38d8f5;

  animation:spin 7s linear infinite;
}

.core::after{
  content:"";

  position:absolute;

  inset:43px;

  border-radius:50%;

  border:1px dashed #38d8f5;

  animation:spin 4s linear infinite reverse;
}

.orb{
  width:75px;
  height:75px;

  border-radius:50%;

  background:#c8faff;

  box-shadow:
    0 0 15px white,
    0 0 40px #00d9ff,
    0 0 90px #00bfff;

  animation:pulse 1.7s infinite;
}

.controls{
  display:flex;

  justify-content:center;

  flex-wrap:wrap;

  gap:12px;

  margin:30px 0;
}

button{
  border:1px solid #42dfff;

  background:#061f2b;

  color:#d7fbff;

  border-radius:10px;

  padding:12px 18px;

  font-weight:bold;

  cursor:pointer;
}

button:hover{
  background:#0b3849;

  box-shadow:
    0 0 20px rgba(0,220,255,.3);
}

.main{
  width:125px;
  height:125px;

  border-radius:50%;

  font-size:16px;
}

.active{
  background:#0b5265;

  box-shadow:
    0 0 50px rgba(0,220,255,.6);
}

.console{
  border:1px solid #1d6177;

  background:rgba(2,10,16,.92);

  padding:20px;

  min-height:180px;
}

.label{
  color:#5de4ff;

  font-size:11px;

  letter-spacing:3px;
}

#message{
  margin-top:15px;

  font-size:22px;

  line-height:1.6;
}

.input{
  display:flex;

  gap:10px;

  margin-top:18px;
}

input{
  flex:1;

  padding:12px;

  background:#06141d;

  border:1px solid #245a6b;

  color:white;

  border-radius:8px;

  outline:none;
}

.list{
  max-height:135px;

  overflow:auto;

  font-size:12px;
}

.item{
  padding:7px 0;

  border-bottom:1px solid #123744;
}

.help{
  margin-top:18px;

  color:#739ba8;

  font-size:12px;

  line-height:1.8;
}

@keyframes pulse{
  50%{
    transform:scale(1.12);
    opacity:.7;
  }
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

@media(max-width:760px){

  .hud{
    grid-template-columns:1fr;
  }

  .core{
    grid-row:1;
  }
}
</style>
</head>

<body>

<div class="app">

  <div class="top">

    <div class="logo">
      이비
    </div>

    <div
      id="status"
      class="status"
    >
      휴면 상태
    </div>

  </div>


  <div class="hud">

    <section class="panel">

      <h3>SYSTEM</h3>

      <div class="info">

        마이크:
        <span id="mic">대기</span>

        <br>

        음성 인식:
        <span id="speech">대기</span>

        <br>

        상태:
        <span id="mode">SLEEP</span>

        <br>

        박수:
        <span id="clap">대기</span>

      </div>

    </section>


    <div class="core">
      <div class="orb"></div>
    </div>


    <section class="panel">

      <h3>COMMAND LOG</h3>

      <div
        id="history"
        class="list"
      ></div>

    </section>

  </div>


  <div class="controls">

    <button
      id="startBtn"
      class="main"
    >
      마이크<br>시작
    </button>

    <button id="sleepBtn">
      휴면
    </button>

    <button id="testBtn">
      음성 테스트
    </button>

  </div>


  <div class="console">

    <div class="label">
      이비 OUTPUT
    </div>

    <div id="message">
      마이크를 시작해주세요.
    </div>

    <div class="input">

      <input
        id="manual"
        placeholder="이비, 명령을 입력하세요"
      >

      <button id="send">
        실행
      </button>

    </div>

  </div>


  <div class="help">

    처음에는 휴면 상태입니다.

    <br>

    👏👏
    <b>박수를 정확히 두 번</b>
    치면 이비가 활성화됩니다.

    <br>

    활성화된 뒤에는
    <b>"이비"</b>를 먼저 부르면 대화를 시작합니다.

    <br><br>

    예:

    <br>
    "이비, 안녕"

    <br>
    "이비, 지금 몇 시야?"

    <br>
    "이비, 오늘 서울 날씨 어때?"

    <br>
    "이비, 유튜브 열어줘"

    <br>
    "이비, 마인크래프트 검색해줘"

    <br>
    "이비, 쉬어"

  </div>

</div>


<script>

/* =========================================================
   상태
========================================================= */

let running = false;

let awake = false;

let listening = false;

let recognition = null;

let recognitionSupported = false;

let micStream = null;

let audioContext = null;

let analyser = null;

let gainNode = null;


/*
  박수 관련

  중요:
  박수 횟수를 화면에 누적 표시하지 않는다.
*/

let clapCandidates = [];

let lastClapTime = 0;

let clapCooldownUntil = 0;

let clapSequenceTimer = null;


/*
  음성 명령 중복 방지
*/

let lastCommand = "";

let lastCommandTime = 0;


/*
  로그
*/

let history = [];


/* =========================================================
   DOM
========================================================= */

const $ = id =>
  document.getElementById(id);


/* =========================================================
   로그
========================================================= */

function log(text){

  history.unshift(text);

  history =
    history.slice(0,12);

  $("history").innerHTML =
    history
      .map(
        item =>
          `<div class="item">${escapeHtml(item)}</div>`
      )
      .join("");
}


function escapeHtml(text){

  return String(text).replace(
    /[&<>"']/g,

    char => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[char])
  );
}


/* =========================================================
   음성 출력
========================================================= */

function speak(text){

  $("message").textContent =
    text;

  if(
    !("speechSynthesis" in window)
  ){

    return;
  }


  speechSynthesis.cancel();


  const voice =
    new SpeechSynthesisUtterance(
      text
    );


  voice.lang =
    "ko-KR";


  /*
    낮고 차분한 비서 느낌
  */

  voice.rate =
    0.86;

  voice.pitch =
    0.70;

  voice.volume =
    1;


  speechSynthesis.speak(
    voice
  );
}


/* =========================================================
   상태 변경
========================================================= */

function setAwake(value){

  awake = value;

  $("mode").textContent =
    value
      ? "ACTIVE"
      : "SLEEP";

  $("status").textContent =
    value
      ? "이비 활성화"
      : "휴면 상태";
}


/* =========================================================
   활성화
========================================================= */

function wakeUp(){

  if(!running){
    return;
  }

  if(awake){
    return;
  }


  setAwake(true);


  $("clap").textContent =
    "👏👏 감지";


  log(
    "👏👏 이비 활성화"
  );


  speak(
    "안녕하세요. 오늘은 무엇을 도와드릴까요?"
  );


  setTimeout(
    () => {
      $("clap").textContent =
        "대기";
    },
    1800
  );


  setTimeout(
    startRecognition,
    800
  );
}


/* =========================================================
   휴면
========================================================= */

function sleep(){

  if(!awake){
    return;
  }


  setAwake(false);


  stopRecognition();


  speak(
    "휴면 상태에 돌입합니다."
  );


  log(
    "휴면 상태"
  );
}


/* =========================================================
   마이크
========================================================= */

async function startMicrophone(){

  if(running){
    return;
  }


  try{

    micStream =
      await navigator.mediaDevices.getUserMedia({

        audio:{
          echoCancellation:true,

          noiseSuppression:true,

          autoGainControl:true,

          channelCount:1,

          sampleRate:48000
        }

      });


    audioContext =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();


    if(
      audioContext.state ===
      "suspended"
    ){

      await audioContext.resume();
    }


    const source =
      audioContext
        .createMediaStreamSource(
          micStream
        );


    /*
      음성 인식용 마이크 증폭.

      너무 과하게 올리면
      주변 소음도 커지므로
      1.7배 정도로 제한.
    */

    gainNode =
      audioContext
        .createGain();


    gainNode.gain.value =
      1.7;


    analyser =
      audioContext
        .createAnalyser();


    analyser.fftSize =
      2048;


    /*
      너무 빠르게 흔들리지 않게
      약간의 smoothing
    */

    analyser.smoothingTimeConstant =
      0.08;


    source.connect(
      gainNode
    );


    gainNode.connect(
      analyser
    );


    running = true;


    $("mic").textContent =
      "정상";


    $("startBtn")
      .classList
      .add("active");


    $("startBtn").innerHTML =
      "마이크<br>ON";


    log(
      "마이크 연결 완료"
    );


    speak(
      "마이크가 준비되었습니다."
    );


    /*
      박수 감지 시작
    */

    detectClap();


  }catch(error){

    console.error(error);


    $("mic").textContent =
      "권한 필요";


    speak(
      "마이크 권한을 허용해주세요."
    );
  }
}


/* =========================================================
   박수 감지
========================================================= */

/*
  이번 버전에서는 박수 감도를
  일부러 꽤 엄격하게 잡는다.

  단순히 큰 소리 = 박수로 판단하지 않고,

  1. 매우 짧은 순간
  2. 높은 피크
  3. 충분히 높은 RMS
  4. 앞뒤로 소리가 빠르게 떨어짐

  조건을 같이 확인한다.
*/

function detectClap(){

  if(!running){
    return;
  }


  const buffer =
    new Float32Array(
      analyser.fftSize
    );


  analyser.getFloatTimeDomainData(
    buffer
  );


  let sum = 0;

  let peak = 0;

  let positivePeaks = 0;

  let negativePeaks = 0;


  for(
    let i=0;
    i<buffer.length;
    i++
  ){

    const value =
      buffer[i];


    const abs =
      Math.abs(value);


    sum +=
      value * value;


    if(
      abs > peak
    ){

      peak = abs;
    }


    if(
      value > 0.48
    ){

      positivePeaks++;
    }


    if(
      value < -0.48
    ){

      negativePeaks++;
    }

  }


  const rms =
    Math.sqrt(
      sum / buffer.length
    );


  /*
    강한 순간 피크가 있어야 함.
  */

  const strongPeak =
    peak >= 0.72;


  /*
    전체 에너지도 충분해야 함.
  */

  const strongRms =
    rms >= 0.18;


  /*
    양/음 방향으로 급격한 변화가
    어느 정도 있어야 함.
  */

  const transientShape =
    positivePeaks >= 2 &&
    negativePeaks >= 2;


  const possibleClap =
    strongPeak &&
    strongRms &&
    transientShape;


  const now =
    performance.now();


  if(
    possibleClap &&
    now > clapCooldownUntil
  ){

    /*
      500ms 안에는 같은 박수의
      여러 피크를 하나로 취급
    */

    clapCooldownUntil =
      now + 500;


    registerClap();

  }


  requestAnimationFrame(
    detectClap
  );
}


/* =========================================================
   박수 등록
========================================================= */

function registerClap(){

  /*
    활성 상태에서는
    박수를 완전히 무시한다.
  */

  if(awake){
    return;
  }


  const now =
    performance.now();


  /*
    첫 박수 이후
    350ms ~ 1400ms 사이에
    두 번째 박수가 있어야 한다.

    너무 빠른 중복 피크:
    무시

    너무 느린 소리:
    새로운 첫 박수
  */

  if(
    lastClapTime === 0 ||
    now - lastClapTime > 1400
  ){

    lastClapTime =
      now;

    /*
      화면에는 1/2를 표시하지 않는다.
    */

    $("clap").textContent =
      "박수 감지";

    clearTimeout(
      clapSequenceTimer
    );


    /*
      1.5초 안에 두 번째 박수가
      없으면 다시 대기
    */

    clapSequenceTimer =
      setTimeout(
        () => {

          lastClapTime = 0;

          $("clap").textContent =
            "대기";

        },
        1450
      );


    return;
  }


  const gap =
    now - lastClapTime;


  /*
    너무 빨리 들어온 두 번째 피크는
    같은 박수의 울림일 가능성이 높다.
  */

  if(gap < 350){

    return;
  }


  /*
    정확한 2번째 박수
  */

  if(
    gap >= 350 &&
    gap <= 1400
  ){

    lastClapTime =
      0;


    clearTimeout(
      clapSequenceTimer
    );


    $("clap").textContent =
      "👏👏 감지";


    log(
      "👏👏 박수 2회 감지"
    );


    wakeUp();


    setTimeout(
      () => {

        $("clap").textContent =
          "대기";

      },
      1800
    );

  }

}


/* =========================================================
   음성 인식 설정
========================================================= */

function setupRecognition(){

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if(!SpeechRecognition){

    recognitionSupported =
      false;

    $("speech").textContent =
      "지원 안 함";

    return;
  }


  recognitionSupported =
    true;


  recognition =
    new SpeechRecognition();


  recognition.lang =
    "ko-KR";


  recognition.continuous =
    true;


  /*
    중간 결과 활성화.
    다만 명령 실행은 final 결과에서만 한다.
  */

  recognition.interimResults =
    true;


  /*
    여러 후보를 확보.
  */

  recognition.maxAlternatives =
    8;


  recognition.onstart =
    () => {

      listening = true;

      $("speech").textContent =
        "듣는 중";
    };


  recognition.onresult =
    event => {

      if(!awake){
        return;
      }


      let finalText =
        "";


      for(
        let i=event.resultIndex;

        i<event.results.length;

        i++
      ){

        const result =
          event.results[i];


        if(
          result.isFinal
        ){

          /*
            가장 높은 확률 후보 사용
          */

          finalText +=
            result[0]
              .transcript;
        }

      }


      finalText =
        finalText.trim();


      if(!finalText){
        return;
      }


      log(
        "YOU: " +
        finalText
      );


      /*
        호출어 인식.

        "이비"
        "이비야"

        둘 다 허용.
      */

      if(
        !containsWakeWord(
          finalText
        )
      ){

        /*
          호출어가 없는 일반 대화는
          명령으로 처리하지 않는다.
        */

        return;
      }


      const command =
        removeWakeWord(
          finalText
        );


      /*
        "이비"만 말한 경우
      */

      if(!command){

        speak(
          "네. 말씀하세요."
        );

        return;
      }


      /*
        같은 문장이 짧은 시간 안에
        중복 인식되는 것 방지
      */

      const now =
        Date.now();


      if(
        command === lastCommand &&
        now-lastCommandTime < 1800
      ){

        return;
      }


      lastCommand =
        command;


      lastCommandTime =
        now;


      handleCommand(
        command
      );

    };


  recognition.onerror =
    event => {

      console.log(
        "음성 인식 오류:",
        event.error
      );


      $("speech").textContent =
        "재연결";


      /*
        aborted / no-speech는
        자동 재시작
      */

      if(
        awake &&
        running
      ){

        setTimeout(
          startRecognition,
          300
        );
      }

    };


  recognition.onend =
    () => {

      listening = false;

      $("speech").textContent =
        "대기";


      if(
        awake &&
        running
      ){

        setTimeout(
          startRecognition,
          300
        );

      }

    };

}


/* =========================================================
   호출어 처리
========================================================= */

function normalizeSpeech(text){

  return text
    .normalize("NFC")
    .replace(
      /[\u200B-\u200D\uFEFF]/g,
      ""
    )
    .replace(
      /\s+/g,
      " "
    )
    .trim()
    .toLowerCase();
}


function containsWakeWord(text){

  const normalized =
    normalizeSpeech(text)
      .replace(
        /[\s,!?。，]+/g,
        ""
      );


  /*
    음성 인식이 약간 다르게 인식할 수 있는
    호출어 후보도 허용한다.
  */

  const wakeWords = [

    "이비",

    "이비야",

    "에비",

    "에비야",

    "이피",

    "이피야"

  ];


  return wakeWords.some(
    word =>
      normalized.includes(
        word
      )
  );
}


function removeWakeWord(text){

  let result =
    normalizeSpeech(text);


  const wakeWords = [

    "이비야",

    "이비",

    "에비야",

    "에비",

    "이피야",

    "이피"

  ];


  for(
    const word of wakeWords
  ){

    const index =
      result.indexOf(word);


    if(index !== -1){

      result =
        result.slice(
          index + word.length
        );


      break;
    }

  }


  return result
    .replace(
      /^[,\s]+/,
      ""
    )
    .trim();
}


/* =========================================================
   음성 인식 시작
========================================================= */

function startRecognition(){

  if(
    !recognitionSupported ||
    !recognition ||
    !running ||
    !awake ||
    listening
  ){

    return;
  }


  try{

    recognition.start();

  }catch{

    /*
      이미 시작된 경우 무시
    */

  }

}


/* =========================================================
   음성 인식 정지
========================================================= */

function stopRecognition(){

  if(!recognition){
    return;
  }


  try{

    recognition.stop();

  }catch{

  }

}


/* =========================================================
   명령 처리
========================================================= */

async function handleCommand(raw){

  const text =
    normalizeSpeech(raw);


  /* =========================
     휴면
  ========================= */

  if(
    text.includes("쉬어") ||
    text.includes("쉬어줘") ||
    text.includes("쉬어 줘") ||
    text.includes("휴면") ||
    text.includes("잠들어") ||
    text.includes("잠자") ||
    text.includes("대기해")
  ){

    sleep();

    return;
  }


  /* =========================
     시간
  ========================= */

  if(
    text.includes("시간") ||
    text.includes("몇시") ||
    text.includes("몇 시") ||
    text.includes("시각") ||
    text.includes("현재시간") ||
    text.includes("지금시간")
  ){

    try{

      const response =
        await fetch(
          "/api/time"
        );


      const data =
        await response.json();


      speak(
        "현재 시간은 " +
        data.text +
        "입니다."
      );


      log(
        "시간: " +
        data.text
      );


    }catch{

      speak(
        "시간 정보를 가져오지 못했습니다."
      );

    }

    return;
  }


  /* =========================
     날씨
  ========================= */

  if(
    text.includes("날씨") ||
    text.includes("기온") ||
    text.includes("비와") ||
    text.includes("비가와") ||
    text.includes("눈와") ||
    text.includes("눈이와") ||
    text.includes("춥") ||
    text.includes("더워") ||
    text.includes("온도")
  ){

    const city =
      extractCity(text) ||
      "서울";


    try{

      const response =
        await fetch(
          "/api/weather?city=" +
          encodeURIComponent(city)
        );


      const data =
        await response.json();


      if(!response.ok){
        throw new Error();
      }


      const answer =
        `${data.city}의 현재 날씨는 ${data.condition}이고, 기온은 ${data.temperature}도, 체감온도는 ${data.feelsLike}도입니다.`;


      speak(answer);


      log(
        "날씨: " +
        answer
      );


    }catch{

      speak(
        "날씨 정보를 가져오지 못했습니다."
      );

    }

    return;
  }


  /* =========================
     검색
  ========================= */

  if(
    text.includes("검색") ||
    text.includes("찾아줘") ||
    text.includes("찾아봐") ||
    text.includes("찾아 봐") ||
    text.includes("검색해줘") ||
    text.includes("검색해 줘")
  ){

    let query =
      text;


    const removeWords = [

      "검색해줘",
      "검색해 줘",
      "검색해",
      "검색",
      "찾아줘",
      "찾아 줘",
      "찾아봐",
      "찾아 봐"

    ];


    for(
      const word of removeWords
    ){

      query =
        query.replace(
          word,
          ""
        );
    }


    query =
      query.trim();


    if(!query){

      speak(
        "무엇을 검색할까요?"
      );

      return;
    }


    try{

      const response =
        await fetch(
          "/api/search?q=" +
          encodeURIComponent(
            query
          )
        );


      const data =
        await response.json();


      window.open(
        data.url,
        "_blank"
      );


      speak(
        query +
        " 검색 결과를 열었습니다."
      );


      log(
        "검색: " +
        query
      );


    }catch{

      speak(
        "검색을 실행하지 못했습니다."
      );

    }

    return;
  }


  /* =========================
     유튜브
  ========================= */

  if(
    text.includes("유튜브") ||
    text.includes("유튜브 열어") ||
    text.includes("유튜브 켜")
  ){

    window.open(
      "https://www.youtube.com/",
      "_blank"
    );


    speak(
      "유튜브를 열겠습니다."
    );


    return;
  }


  /* =========================
     네이버
  ========================= */

  if(
    text.includes("네이버") ||
    text.includes("네이버 열어") ||
    text.includes("네이버 켜")
  ){

    window.open(
      "https://www.naver.com/",
      "_blank"
    );


    speak(
      "네이버를 열겠습니다."
    );


    return;
  }


  /* =========================
     구글
  ========================= */

  if(
    text.includes("구글") ||
    text.includes("구글 열어") ||
    text.includes("구글 켜")
  ){

    window.open(
      "https://www.google.com/",
      "_blank"
    );


    speak(
      "구글을 열겠습니다."
    );


    return;
  }


  /* =========================
     유튜브 검색
  ========================= */

  if(
    text.includes("유튜브에서")
  ){

    const query =
      text
        .replace(
          "유튜브에서",
          ""
        )
        .replace(
          "검색해줘",
          ""
        )
        .trim();


    if(query){

      window.open(
        "https://www.youtube.com/results?search_query=" +
        encodeURIComponent(query),
        "_blank"
      );


      speak(
        query +
        " 유튜브 검색 결과를 열었습니다."
      );

    }

    return;
  }


  /* =========================
     안녕
  ========================= */

  if(
    text.includes("안녕") ||
    text.includes("안녕하세요") ||
    text.includes("반가워")
  ){

    speak(
      "안녕하세요. 무엇을 도와드릴까요?"
    );

    return;
  }


  /* =========================
     고마워
  ========================= */

  if(
    text.includes("고마워") ||
    text.includes("고맙다") ||
    text.includes("감사해") ||
    text.includes("감사합니다")
  ){

    speak(
      "천만에요."
    );

    return;
  }


  /* =========================
     이름
  ========================= */

  if(
    text.includes("너 이름") ||
    text.includes("네 이름") ||
    text.includes("이름이 뭐") ||
    text.includes("누구야") ||
    text.includes("누구니")
  ){

    speak(
      "제 이름은 이비입니다."
    );

    return;
  }


  /* =========================
     상태
  ========================= */

  if(
    text.includes("뭐해") ||
    text.includes("뭐하고") ||
    text.includes("상태 어때") ||
    text.includes("잘 작동") ||
    text.includes("작동하고 있어")
  ){

    speak(
      "현재 정상적으로 작동하면서 당신의 명령을 기다리고 있습니다."
    );

    return;
  }


  /* =========================
     도움말
  ========================= */

  if(
    text.includes("도와줘") ||
    text.includes("뭘 할 수 있어") ||
    text.includes("뭐 할 수 있어") ||
    text.includes("기능") ||
    text.includes("할 수 있는 것")
  ){

    speak(
      "시간 확인, 날씨 확인, 검색, 유튜브와 웹사이트 열기, 간단한 계산과 일반적인 대화를 할 수 있습니다."
    );

    return;
  }


  /* =========================
     계산
  ========================= */

  if(
    text.includes("계산")
  ){

    let expression =
      text
        .replace(
          /계산해줘/g,
          ""
        )
        .replace(
          /계산해 줘/g,
          ""
        )
        .replace(
          /계산/g,
          ""
        );


    expression =
      expression
        .replace(
          /더하기/g,
          "+"
        )
        .replace(
          /빼기/g,
          "-"
        )
        .replace(
          /곱하기/g,
          "*"
        )
        .replace(
          /나누기/g,
          "/"
        );


    /*
      계산에 사용할 수 있는 문자만 허용
    */

    const safe =
      expression.replace(
        /[^0-9+\-*/(). ]/g,
        ""
      );


    if(!safe){

      speak(
        "계산식을 말씀해주세요."
      );

      return;
    }


    try{

      const result =
        Function(
          `"use strict";return (${safe})`
        )();


      speak(
        "계산 결과는 " +
        result +
        "입니다."
      );


    }catch{

      speak(
        "계산식을 이해하지 못했습니다."
      );
    }


    return;
  }


  /* =========================
     시간 관련 자연어
  ========================= */

  if(
    text.includes("지금") &&
    (
      text.includes("몇") ||
      text.includes("시")
    )
  ){

    handleCommand(
      "현재 시간"
    );

    return;
  }


  /* =========================
     일반적인 대화
  ========================= */

  if(
    text.includes("오늘 뭐 하지") ||
    text.includes("뭐 하지") ||
    text.includes("심심해")
  ){

    speak(
      "원하시면 검색이나 음악, 영상을 찾아드릴 수 있습니다."
    );

    return;
  }


  if(
    text.includes("잘 자") ||
    text.includes("잘자")
  ){

    speak(
      "편안한 시간 보내세요."
    );

    return;
  }


  if(
    text.includes("좋아") ||
    text.includes("최고야")
  ){

    speak(
      "감사합니다."
    );

    return;
  }


  /*
    모르는 말도 그냥 무시하지 않고
    이비가 들었다는 것을 알려준다.
  */

  speak(
    `"${raw}"이라고 말씀하셨군요. 아직 그 요청에는 대응할 수 없습니다.`
  );


  log(
    "미지원 명령: " +
    raw
  );
}


/* =========================================================
   도시
========================================================= */

function extractCity(text){

  const cities = [

    "서울",
    "부산",
    "인천",
    "대구",
    "대전",
    "광주",
    "울산",
    "수원",
    "용인",
    "성남",
    "제주",
    "강릉",
    "전주",
    "청주",
    "천안",
    "평택"

  ];


  return (
    cities.find(
      city =>
        text.includes(city)
    ) || ""
  );
}


/* =========================================================
   버튼
========================================================= */

$("startBtn").onclick =
  startMicrophone;


$("sleepBtn").onclick =
  () => {

    if(!running){

      startMicrophone();

      return;
    }


    if(awake){

      sleep();

    }else{

      /*
        버튼을 통한 테스트용 활성화
      */

      wakeUp();
    }

  };


$("testBtn").onclick =
  () => {

    if(!running){

      speak(
        "먼저 마이크를 시작해주세요."
      );

      return;
    }


    if(!awake){

      speak(
        "현재 휴면 상태입니다."
      );

      return;
    }


    speak(
      "음성 인식 시스템이 정상적으로 작동하고 있습니다."
    );

  };


/* =========================================================
   직접 입력
========================================================= */

$("send").onclick =
  () => {

    const value =
      $("manual")
        .value
        .trim();


    if(!value){
      return;
    }


    $("manual").value =
      "";


    if(!awake){

      speak(
        "현재 휴면 상태입니다."
      );

      return;
    }


    if(
      !containsWakeWord(
        value
      )
    ){

      speak(
        "이비를 먼저 불러주세요."
      );

      return;
    }


    const command =
      removeWakeWord(
        value
      );


    if(!command){

      speak(
        "네. 말씀하세요."
      );

      return;
    }


    handleCommand(
      command
    );

  };


$("manual").addEventListener(
  "keydown",
  event => {

    if(
      event.key === "Enter"
    ){

      $("send").click();

    }

  }
);


/* =========================================================
   시작
========================================================= */

setupRecognition();

</script>
